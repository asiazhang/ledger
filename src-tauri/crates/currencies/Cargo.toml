[package]
name = "ledger-currencies"
version = "0.11.2"
description = "Ledger 币种域 crate：币种字典、汇率与本位币基准（Currency / DefaultCurrency）"
edition = "2024"
publish = false

[dependencies]
ledger-infra = { path = "../infra" }
ledger-sync-protocol = { path = "../sync-protocol" }
ledger-transaction = { path = "../transaction" }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "trace"] }
serde = { version = "1", features = ["derive"] }
utoipa = { version = "5", features = ["axum_extras"] }

[dev-dependencies]
tauri-app = { path = "../.." }

[lints]
workspace = true
