[package]
name = "ledger-transaction"
version = "0.11.2"
description = "Ledger 核心交易域 crate：交易写入协议、金额口径、读取与搜索（Transaction / Amount Model）"
edition = "2024"
publish = false

[dependencies]
ledger-infra = { path = "../infra" }
ledger-sync-protocol = { path = "../sync-protocol" }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "trace"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tracing = "0.1"
utoipa = { version = "5", features = ["axum_extras"] }
pinyin = "0.11"

[dev-dependencies]
tauri-app = { path = "../.." }
serde_json = "1"
ledger-infra = { path = "../infra", features = ["test-utils"] }
ledger-accounts = { path = "../accounts" }
ledger-backup = { path = "../backup" }
ledger-categories = { path = "../categories" }
ledger-currencies = { path = "../currencies" }
ledger-dashboard = { path = "../dashboard" }
ledger-investment = { path = "../investment" }
ledger-scheduled = { path = "../scheduled" }
ledger-sync-engine = { path = "../sync-engine" }

[lints]
workspace = true
