[package]
name = "ledger-transaction"
version = "0.6.0"
description = "Ledger 核心交易域 crate：交易写入协议、金额口径、读取与搜索（Transaction / Amount Model）"
edition = "2024"
publish = false
# 版本与根包锁步（仓库约定：workspace 各成员同为 0.6.0）。

[dependencies]
# 核心交易域 crate（spec #1086 / issue #1092，P2 首个拆出的底层业务域 crate）：
# 依赖面只有基础设施与同步协议——是全部业务域可依赖的最底层域，对根包（壳层）
# 与任何业务域零依赖。迁移前对投资/商户/币种/物品/保单/账户六域的残留边已按
# 挂载点反转收敛（#1092 前置提交，ADR-0112 决策 5）：本域只定义注册点，实现由
# 各提供域装入、壳层启动接线。
ledger-infra = { path = "../infra" }
ledger-sync-protocol = { path = "../sync-protocol" }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "trace"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tracing = "0.1"
utoipa = { version = "5", features = ["axum_extras"] }
pinyin = "0.11"

[dev-dependencies]
# 测试专用边（spec #1086 明文裁决「测试工厂与器具以 dev-dependency 环供各域
# 复用，Cargo 允许」）：域单测用根包的统一测试数据库工厂与共享断言
# （test_support，ADR-0084）、跨域对拍（账户余额 / 仪表盘净资产 / 备份置脏 /
# 同步 op 读取）与投资/币种域的种子与基准切换。dev-dependency 环由 Cargo 允许
# ——测试目标与生产依赖图分离，不构成生产环；结构守门的依赖方向核对只辖生产
# 依赖（本 crate 声明 tauri-app 为生产依赖即红，负向夹具见 check-structure.test.ts）。
# 由于该环，本 crate 不能像协议 crate 那样以 `use tauri_app_lib::…` compile_fail
# 文档用例承载反向引用负向例（dev-dependency 对 doctest 可见，会击穿该形态）——
# 反向引用的编译期拒绝由生产依赖面承担（lib 目标解析不到 dev-dependency），
# 机器面负向核对住结构守门的 crate 依赖方向（ledger-backup crate 同款留痕）。
tauri-app = { path = "../.." }
serde_json = "1"
# 域单测经 test-utils feature 消费基础设施测试器具（信号捕获，#1132 cfg 门）。
ledger-infra = { path = "../infra", features = ["test-utils"] }

# 六件套易 panic 构造门禁经 workspace 继承（ADR-0060 / spec #1086 门禁前置）：
# 本行是继承接线，缺失即门禁静默消失，由 scripts/check-structure.ts 守门。
[lints]
workspace = true
