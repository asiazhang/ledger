[package]
name = "ledger-budget"
version = "0.11.2"
description = "Ledger 预算域 crate：预算 CRUD、周期口径与当前周期进度（Budget）"
edition = "2024"
publish = false

[dependencies]
ledger-infra = { path = "../infra" }
ledger-sync-protocol = { path = "../sync-protocol" }
ledger-transaction = { path = "../transaction" }
chrono = "0.4.45"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "trace"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tauri-app = { path = "../.." }
serde_json = "1"

[lints]
workspace = true
