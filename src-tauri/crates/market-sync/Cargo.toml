[package]
name = "ledger-market-sync"
version = "0.11.2"
description = "Ledger 行情同步域 crate：腾讯/新浪行情抓取（批量报价 / 日 K / 基金净值）与增量同步编排"
edition = "2024"
publish = false

[dependencies]
ledger-infra = { path = "../infra" }
ledger-sync-protocol = { path = "../sync-protocol" }
ledger-transaction = { path = "../transaction" }
ledger-investment = { path = "../investment" }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
tokio = { version = "1", features = ["sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42"
encoding_rs = "0.8"
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "trace"] }
tauri = { version = "2", features = ["tracing"] }
tracing = "0.1"

[dev-dependencies]
tauri-app = { path = "../.." }
ledger-infra = { path = "../infra", features = ["test-utils"] }
url = "2"

[lints]
workspace = true
