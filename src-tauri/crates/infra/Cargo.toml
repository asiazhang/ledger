[package]
name = "ledger-infra"
version = "0.11.2"
description = "Ledger 后端基础设施 crate：无域语义、被所有层消费"
edition = "2024"
publish = false

[features]
test-utils = []
http = ["dep:axum"]

[dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "trace", "serialize"] }
rusqlite_migration = "2.6"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.23", features = ["v7", "v5", "serde"] }
thiserror = "2.0.18"
tauri = { version = "2", features = ["tracing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", optional = true }
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
tracing = "0.1"
tokio = { version = "1", features = ["sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
security-framework-sys = "2.17"
objc2-local-authentication = "0.3"
block2 = { version = "0.6", default-features = false, features = ["alloc"] }
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "alloc",
  "NSString",
  "NSError",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }
tauri-app = { path = "../.." }
ledger-backup = { path = "../backup" }
ledger-transaction = { path = "../transaction" }
ledger-accounts = { path = "../accounts" }

[lints]
workspace = true
