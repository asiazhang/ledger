[package]
name = "ledger-merchants"
version = "0.6.0"
description = "Ledger 商户域 crate：商户字典 CRUD 与按名查找/即建（Merchant）"
edition = "2024"
publish = false
# 版本与根包锁步（仓库约定：workspace 各成员同为 0.6.0）。

[dependencies]
# 商户域 crate（spec #1086 / issue #1096，参考数据三域各自独立 crate、不合并）：
# 依赖面只有基础设施、同步协议与核心交易域——交易×商户接缝
#（`ledger-transaction::merchant_seam`，#1092）的商户名先查/即建实现由本 crate
# 注册（`install_merchant_hooks`，壳层启动接线）；域→域依赖方向单一（商户 →
# 核心交易），反向引用由 cargo 依赖图编译期拒绝。对根包（壳层）与同步域零直接
# 依赖：同步命令契约、op 产出与设备标识走 `ledger-sync-protocol`，重放分派住
# sync_engine（业务域→同步域零容忍，ADR-0101 决策 4b）。
ledger-infra = { path = "../infra" }
ledger-sync-protocol = { path = "../sync-protocol" }
ledger-transaction = { path = "../transaction" }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "trace"] }
serde = { version = "1", features = ["derive"] }
utoipa = { version = "5", features = ["axum_extras"] }

[dev-dependencies]
# 测试专用边（spec #1086 明文裁决「测试工厂与器具以 dev-dependency 环供各域
# 复用，Cargo 允许」）：域单测用根包的统一测试数据库工厂与共享断言
# （test_support，ADR-0084）。dev-dependency 环由 Cargo 允许——测试目标与生产
# 依赖图分离，不构成生产环；结构守门的依赖方向核对只辖生产依赖（本 crate 声明
# tauri-app 为生产依赖即红，负向夹具见 check-structure.test.ts）。由于该环，
# 本 crate 不能像协议 crate 那样以 `use tauri_app_lib::…` compile_fail 文档用例
# 承载反向引用负向例（dev-dependency 对 doctest 可见，会击穿该形态）——反向
# 引用的编译期拒绝由生产依赖面承担（lib 目标解析不到 dev-dependency），机器面
# 负向核对住结构守门的 crate 依赖方向（ledger-backup/ledger-transaction 同款留痕）。
tauri-app = { path = "../.." }
serde_json = "1"

# 六件套易 panic 构造门禁经 workspace 继承（ADR-0060 / spec #1086 门禁前置）：
# 本行是继承接线，缺失即门禁静默消失，由 scripts/check-structure.ts 守门。
[lints]
workspace = true
