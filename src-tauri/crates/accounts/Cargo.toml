[package]
name = "ledger-accounts"
version = "0.6.0"
description = "Ledger 账户域 crate：账户 CRUD、余额口径与余额缓存、同步命令（Account / Balance）"
edition = "2024"
publish = false
# 版本与根包锁步（仓库约定：workspace 各成员同为 0.6.0）。

[dependencies]
# 账户域 crate（spec #1086 / issue #1093，P3 叶子业务域 crate）：依赖面只有基础
# 设施、同步协议与核心交易域——余额口径消费核心交易域 kind→度量矩阵
# （accounts → transaction 单向，ADR-0071 决策 5 修订后方向），同步命令消费协议
# 面（issue #860）；对根包（壳层）与同级业务域零依赖。写路径副作用（余额刷新）
# 与出资账户视图按注册点反转形态住本域实现侧（挂载点②/⑤，ADR-0112 决策 5），
# 由壳层启动时接线。
ledger-infra = { path = "../infra" }
ledger-sync-protocol = { path = "../sync-protocol" }
ledger-transaction = { path = "../transaction" }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "trace"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
utoipa = { version = "5", features = ["axum_extras"] }

[dev-dependencies]
# 测试专用边（spec #1086 明文裁决「测试工厂与器具以 dev-dependency 环供各域
# 复用，Cargo 允许」）：域单测用根包的统一测试数据库工厂与共享断言
# （test_support，ADR-0084）与报表域跨域对拍（黑洞账户交易计入报表）。dev-
# dependency 环由 Cargo 允许——测试目标与生产依赖图分离，不构成生产环；结构
# 守门的依赖方向核对只辖生产依赖（本 crate 声明 tauri-app 为生产依赖即红，
# 负向夹具见 check-structure.test.ts）。由于该环，本 crate 不能像协议 crate
# 那样以 `use tauri_app_lib::…` 的 compile_fail 文档用例承载反向引用负向例
# （dev-dependency 对 doctest 可见，会击穿该形态）——反向引用的编译期拒绝由
# 生产依赖面承担（lib 目标解析不到 dev-dependency），机器面负向核对住结构守门
# 的 crate 依赖方向（ledger-backup/ledger-transaction crate 同款留痕）。
tauri-app = { path = "../.." }
# 域单测经 test-utils feature 消费基础设施测试器具（信号捕获，#1132 cfg 门）。
ledger-infra = { path = "../infra", features = ["test-utils"] }

# 六件套易 panic 构造门禁经 workspace 继承（ADR-0060 / spec #1086 门禁前置）：
# 本行是继承接线，缺失即门禁静默消失，由 scripts/check-structure.ts 守门。
[lints]
workspace = true
