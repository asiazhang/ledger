[package]
name = "ledger-backup"
version = "0.11.2"
description = "Ledger 备份域 crate：备份/恢复引擎与自动备份调度（Backup / Restore / AutoBackup）"
edition = "2024"
publish = false

[dependencies]
ledger-infra = { path = "../infra" }
ledger-sync-protocol = { path = "../sync-protocol" }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "trace"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
tracing = "0.1"
tauri = { version = "2", features = ["tracing"] }

[dev-dependencies]
tauri-app = { path = "../.." }
ledger-accounts = { path = "../accounts" }
ledger-infra = { path = "../infra", features = ["test-utils"] }

[lints]
workspace = true
