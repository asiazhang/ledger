[package]
name = "ledger-policy"
version = "0.11.2"
description = "Ledger 保单域 crate：保单静态档案 CRUD、保司字典与保单视角统计（Policy / Insurer）"
edition = "2024"
publish = false

[dependencies]
ledger-infra = { path = "../infra" }
ledger-sync-protocol = { path = "../sync-protocol" }
ledger-transaction = { path = "../transaction" }
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "trace"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tauri-app = { path = "../.." }

[lints]
workspace = true
