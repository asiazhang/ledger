[package]
name = "ledger-scheduled"
version = "0.11.2"
description = "Ledger 定时计划域 crate：定时交易计划/期次引擎/自动执行追补/订阅花费（Scheduled）"
edition = "2024"
publish = false

[dependencies]
ledger-infra = { path = "../infra" }
ledger-sync-protocol = { path = "../sync-protocol" }
ledger-transaction = { path = "../transaction" }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "trace"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tauri-app = { path = "../.." }
ledger-backup = { path = "../backup" }
ledger-merchants = { path = "../merchants" }
ledger-sync-engine = { path = "../sync-engine" }

[lints]
workspace = true
