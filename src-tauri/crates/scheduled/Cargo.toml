[package]
name = "ledger-scheduled"
version = "0.6.0"
description = "Ledger 定时计划域 crate：定时交易计划/期次引擎/自动执行追补/订阅花费（Scheduled）"
edition = "2024"
publish = false
# 版本与根包锁步（仓库约定：workspace 各成员同为 0.6.0）。

[dependencies]
# 定时计划域 crate（spec #1086 / issue #1098，P3 业务域 crate）：依赖面只有基础
# 设施与核心交易域——计划来源反查与商户/保单校验、期次落库均经核心交易域公开面
#（writer 接缝 / amount 矩阵 / 来源列模型），同步命令契约、op 产出与设备标识走
# 协议 crate `ledger-sync-protocol`；对根包（壳层）与同步域零依赖（重放分派住
# sync_engine，业务域→同步域零容忍，ADR-0101 决策 4b）。AC 允许集内的备份域
#（ledger-backup）不声明为依赖：期次落账置脏与追补触发两条边已按注册点反转收敛
#（挂载点③/④，ADR-0112 决策 5），本 crate 生产代码对备份域零引用，反向/横向
# 引用由 cargo 依赖图编译期拒绝。票面允许集「基础设施、协议、核心交易域与备份
# 域」是上限，实际依赖面是其子集（与 #1094 分类域「允许集子集」同口径）。
ledger-infra = { path = "../infra" }
ledger-sync-protocol = { path = "../sync-protocol" }
ledger-transaction = { path = "../transaction" }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "trace"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
# 测试专用边（spec #1086 明文裁决「测试工厂与器具以 dev-dependency 环供各域
# 复用，Cargo 允许」）：域单测用根包的统一测试数据库工厂（test_support，ADR-0084）
# 建库，备份置脏联动断言经根包再导出面读状态。dev-dependency 环由 Cargo 允许——
# 测试目标与生产依赖图分离，不构成生产环；结构守门的依赖方向核对只辖生产依赖
#（本 crate 声明 tauri-app 为生产依赖即红，负向夹具见 check-structure.test.ts）。
# 由于该环，本 crate 不能像协议 crate 那样以 `use tauri_app_lib::…` compile_fail
# 文档用例承载反向引用负向例（dev-dependency 对 doctest 可见，会击穿该形态）——
# 反向引用的编译期拒绝由生产依赖面承担（lib 目标解析不到 dev-dependency），机器面
# 负向核对住结构守门的 crate 依赖方向（ledger-backup/ledger-transaction crate 同款
# 留痕）。
tauri-app = { path = "../.." }

# 六件套易 panic 构造门禁经 workspace 继承（ADR-0060 / spec #1086 门禁前置）：
# 本行是继承接线，缺失即门禁静默消失，由 scripts/check-structure.ts 守门。
[lints]
workspace = true
