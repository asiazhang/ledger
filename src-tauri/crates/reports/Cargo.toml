[package]
name = "ledger-reports"
version = "0.6.0"
description = "Ledger 报表域 crate：月度汇总、分类聚合、商户消费排行与报表日期极值（Report）"
edition = "2024"
publish = false
# 版本与根包锁步（仓库约定：workspace 各成员同为 0.6.0）。

[dependencies]
# 报表域 crate（spec #1086 / issue #1103，P3 叶子业务域 crate）：依赖面是
# 「基础设施、协议、核心交易域」允许集的子集——本域只消费基础设施（db / error）
# 与核心交易域（amount 的 kind→度量矩阵与聚合表达式，汇总口径单一真源）。
# 本域是纯读模型、无同步命令，对同步协议 crate 亦零生产依赖；无接缝无注册点、
# 壳层启动零接线。对根包（壳层）与同步域零直接依赖，反向引用由 cargo 依赖图
# 编译期拒绝（本 crate 声明 tauri-app 为生产依赖即红，负向夹具见
# check-structure.test.ts）。
ledger-infra = { path = "../infra" }
ledger-transaction = { path = "../transaction" }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "trace"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# 测试专用边（spec #1086 明文裁决「测试工厂与器具以 dev-dependency 环供各域
# 复用，Cargo 允许」）：域单测用根包的统一测试数据库工厂与共享断言
#（test_support，ADR-0084）建库与种账户；设备标识走协议 crate 的
# `device_id`（仅测试写入路径需要）。dev-dependency 环由 Cargo 允许——测试目标
# 与生产依赖图分离，不构成生产环；结构守门的依赖方向核对只辖生产依赖。由于
# 该环，本 crate 不能像协议 crate 那样以 `use tauri_app_lib::…` compile_fail
# 文档用例承载反向引用负向例（dev-dependency 对 doctest 可见，会击穿该形态）
# ——反向引用的编译期拒绝由生产依赖面承担（lib 目标解析不到 dev-dependency），
# 机器面负向核对住结构守门的 crate 依赖方向（ledger-backup/ledger-transaction
# crate 同款留痕）。
ledger-sync-protocol = { path = "../sync-protocol" }
tauri-app = { path = "../.." }

# 六件套易 panic 构造门禁经 workspace 继承（ADR-0060 / spec #1086 门禁前置）：
# 本行是继承接线，缺失即门禁静默消失，由 scripts/check-structure.ts 守门。
[lints]
workspace = true
