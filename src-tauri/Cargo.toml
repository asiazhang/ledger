[package]
name = "tauri-app"
version = "0.11.2"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
default-run = "tauri-app"


[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tauri-app"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tracing"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
regex = "1"
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "trace"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.23", features = ["v7", "v5", "serde"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt", "macros", "time"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tower-http = { version = "0.7", features = ["trace"] }
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
utoipa = { version = "5", features = ["axum_extras"] }
ledger-infra = { path = "crates/infra", features = ["http"] }
ledger-sync-protocol = { path = "crates/sync-protocol" }
ledger-backup = { path = "crates/backup" }
ledger-transaction = { path = "crates/transaction" }
ledger-accounts = { path = "crates/accounts" }
ledger-categories = { path = "crates/categories" }
ledger-merchants = { path = "crates/merchants" }
ledger-currencies = { path = "crates/currencies" }
ledger-reports = { path = "crates/reports" }
ledger-dashboard = { path = "crates/dashboard" }
ledger-policy = { path = "crates/policy" }
ledger-scheduled = { path = "crates/scheduled" }
ledger-budget = { path = "crates/budget" }
ledger-physical-asset = { path = "crates/physical-asset" }
ledger-savings-goal = { path = "crates/savings-goal" }
ledger-item = { path = "crates/item" }
ledger-investment = { path = "crates/investment" }
ledger-market-sync = { path = "crates/market-sync" }
ledger-sync-engine = { path = "crates/sync-engine" }
semver = "1.0.28"
url = "2.5.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-updater = { version = "2.13.3", default-features = false, features = [
  "rustls-tls",
  "zip",
] }
tauri-plugin-process = "2.4.0"

[features]
test-utils = ["ledger-infra/test-utils"]

[dev-dependencies]
tauri-app = { path = ".", features = ["test-utils"] }
cucumber = "0.23"
tower = { version = "0.5", features = ["util"] }
rusqlite_migration = "2.6"
http-body-util = "0.1"
zip = { version = "9", default-features = false, features = ["deflate"] }
tauri = { version = "2", features = ["test"] }

[[test]]
name = "e2e"
harness = false

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
lto = true
codegen-units = 1

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[lints]
workspace = true
