[package]
name = "tauri-app"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tracing"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.23", features = ["v7", "serde"] }
thiserror = "2.0.18"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt", "macros", "time"] }
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tower-http = { version = "0.7", features = ["trace"] }
sha2 = "0.11"
utoipa = { version = "5", features = ["axum_extras"] }

[dev-dependencies]
cucumber = "0.23"
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[test]]
name = "e2e"
harness = false

