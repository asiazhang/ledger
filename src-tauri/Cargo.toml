[package]
name = "tauri-app"
version = "0.6.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
# 包内第二个 bin（性能基准工具 src/bin/ledger-perf，spec #458 / ADR-0062）出现后，
# 显式指定默认可执行文件，保证 `cargo run` 与 tauri dev 仍指向主程序。
default-run = "tauri-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tracing"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
regex = "1"
serde_json = "1"
# 加密引擎基座（issue #569 / ADR-0075 决策 1）：SQLCipher 4 静态编译（bundled-sqlcipher），
# OpenSSL 一并 vendored 静态编译，三平台产物自包含；加密参数用 SQLCipher 4 默认值不调参。
# 未设密钥的连接保持明文（SQLCipher 无 key 时行为与标准 SQLite 一致）。
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "trace"] }
rusqlite_migration = "2.6"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.23", features = ["v7", "v5", "serde"] }
thiserror = "2.0.18"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt", "macros", "time"] }
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
tracing = "0.1"
# 日志等级运行期 reload（spec #608）：`tracing-subscriber` 的 `reload` 模块在
# std 下无条件可用；本版本（0.3.23）无独立 `reload` feature（可用 features 见解析）。
# 故无需额外开启 feature，直接使用 `tracing_subscriber::reload`。
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tower-http = { version = "0.7", features = ["trace"] }
sha2 = "0.11"
# SyncEnvelope 信封加密基座（issue #859 / ADR-0091 决策 8）：AES-256-GCM AEAD 与
# PBKDF2-HMAC-SHA512 密钥派生。ring 已随 rustls 进依赖图（同版本 0.17），作为
# 直接依赖零新增传递依赖、零额外构建产物；密钥派生参数与 SQLCipher 默认
# KDF 同量级（PBKDF2 256k 迭代），复用「主口令派生密钥」的既有安全量级。
ring = "0.17"
# WebDAV Basic 凭据编码（issue #859）：base64 已随既有依赖树进锁（同版本 0.23），
# 直接依赖化零新增传递依赖。
base64 = "0.23"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
utoipa = { version = "5", features = ["axum_extras"] }
pinyin = "0.11"
# 基础设施 crate（spec #1086 / issue #1087–#1088）：workspace 成员，承载无域语义、
# 被所有层消费的能力。数据库、错误、设置、文件工具、日志、事件、信号、闭集与
# 壳层统一读写入口已全量归位（#1088）；根包以再导出形态保留 `crate::db` 等原
# 引用路径，域与壳层调用点零改动。
# HTTP 错误响应投影门（issue #1133）：`impl IntoResponse for AppError` 随错误类型
# 住 infra（孤儿规则），axum 依赖经其 `http` feature 门控——仅壳侧（本包）启用。
ledger-infra = { path = "crates/infra", features = ["http"] }
# 同步协议 crate（spec #1086 / issue #1089）：多端同步的最底层共享协议（设备
# 标识、领域命令契约、op 本地记录与读取、位点）——业务域与 sync_engine 共同
# 底座，依赖方向由 cargo 依赖图强制，sync_engine ↔ 业务域环依赖就此断开。
ledger-sync-protocol = { path = "crates/sync-protocol" }
# 备份域 crate（spec #1086 / issue #1091，首个业务域 crate 自根包域目录拆出）：
# 备份/恢复引擎与自动备份调度归位；对根包与任何业务域零依赖——迁移前的两条
# 接缝（追补触发直调、期次落账置脏实现）按注册点反转收敛（挂载点①/④，
# ADR-0112 决策 5），壳层启动时对装。根包 `pub use ledger_backup as backup`
# 再导出保持原调用点路径。
ledger-backup = { path = "crates/backup" }

# 主口令本机缓存（issue #574 / ADR-0075 决策 3）：macOS 系统钥匙串 + Touch ID 生物认证门。
# 仅 macOS 目标编译（security-framework 自带 #![cfg(target_vendor = "apple")]
# 空壳，其余平台为不支持桩，见 db/passphrase_cache.rs）；钥匙串/生物认证的
# 运行期行为以手动冒烟清单验收（issue #574 AC），不进 CI 自动测试。
# 刻意不启用 OSX_10_15（use_protected_keychain / 数据保护钥匙串）：macOS 26 对
# 未签名/ad-hoc 进程的无门 DPK 写入同样报 -34018（#662 本机探针实证；先例
# block/buzz#1266），开发回退走传统钥匙串无门条目，勿因「重签稳定」旧论再开。
# 生物门自 issue #866 起为 LocalAuthentication 应用层门（读取前 LAContext 弹
# Touch ID，条目本身无 ACL）：objc2-local-authentication 与依赖树中 objc2 0.6
# 同代（0.3.x），Developer ID + hardened runtime 可用已被 #657 证据矩阵实证。
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
security-framework-sys = "2.17"
objc2-local-authentication = "0.3"
# 类型桥接（命名生成绑定的公开类型，与依赖树同代，feature 由统一化合并）：
# block2 = LAContext evaluatePolicy 的 reply block；objc2 = runtime Bool；
# objc2-foundation = NSString（localizedReason）/ NSError（错误码）。
block2 = { version = "0.6", default-features = false, features = ["alloc"] }
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "alloc",
  "NSString",
  "NSError",
] }

# 窗口状态插件仅桌面目标参与编译（issue #558 / ADR-0074 决策 6）：该 crate 在
# Android 目标下被整体 cfg 剔除（上游 target-gated），依赖声明、lib.rs 注册处
# 必须同步按目标平台门禁，缺一即 Android 编译失败。沿用 Tauri 官方片段的
# target 三元组条件（Cargo 不解析构建脚本注入的 desktop/mobile 自定义 cfg）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

[features]
# 测试器具可见性（ADR-0111 决策 5 / issue #1132）：`test_utils` 生产不编译，
# 测试目标（单元测试 + 集成测试）经下面的自身 dev-dependency 启用本 feature 与
# `ledger-infra/test-utils`；集成测试消费路径 `tauri_app_lib::test_utils` 不变。
test-utils = ["ledger-infra/test-utils"]

[dev-dependencies]
# 测试器具（ADR-0111 决策 5 / issue #1132）：自身 dev-dependency 仅对测试目标
# 启用 `test-utils`，使 `tauri_app_lib::test_utils` 再导出在测试构建中存在；
# `cargo build` 生产构建不激活 dev-dependency，故不编译测试器具（resolver 3）。
tauri-app = { path = ".", features = ["test-utils"] }
cucumber = "0.23"
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
tauri = { version = "2", features = ["test"] }

[[test]]
name = "e2e"
harness = false

# 多 worktree 并行开发降载：依赖 crate 的 dev 构建只保留行表级调试信息，削减 codegen 与链接体积；
# 本仓业务 crate 不受影响，断点调试行为不变。需要依赖完整符号时临时注释本段。
[profile.dev.package."*"]
debug = "line-tables-only"

# workspace 骨架（spec #1086 / issue #1087）：Rust 根升级为 workspace 根，根包仍是
# tauri 应用包（构建与桌面/Android 打包命令零变化）；成员 crate 集中在 `crates/` 下，
# 用 glob 纳入——新增成员目录自动成为 workspace 成员，不依赖手工清单。
[workspace]
members = ["crates/*"]
resolver = "3"

# 易 panic 构造六件套 deny 门禁（issue #432 / ADR-0060）：门禁约束生产路径；
# 测试目标经 crate 根与集成/BDD 测试 crate 头部 cfg_attr(test, allow) 整体豁免，
# 存量生产 panic 点按 B/C/A 三类逐点豁免安置（清单与纪律见 ADR-0060）。
#
# 门禁的**唯一声明处**在 workspace 级 `[workspace.lints.clippy]`：lint 表不跨
# package 自动继承，成员必须显式写 `[lints] workspace = true`——漏写会让门禁
# 静默消失而 clippy 依然全绿。`scripts/check-structure.ts` 的 crate 边界核对
# 对「成员漏继承」与「新成员未登记」做删除即变红的负向守门（ADR-0056 门禁前置）。
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

# 根包同为 workspace 成员，六件套门禁经 workspace 继承（本表即继承接线）。
[lints]
workspace = true
