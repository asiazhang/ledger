[package]
name = "tauri-app"
version = "0.5.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
# 包内第二个 bin（性能基准工具 src/bin/ledger-perf，spec #458 / ADR-0062）出现后，
# 显式指定默认可执行文件，保证 `cargo run` 与 tauri dev 仍指向主程序。
default-run = "tauri-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tracing"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 加密引擎基座（issue #569 / ADR-0075 决策 1）：SQLCipher 4 静态编译（bundled-sqlcipher），
# OpenSSL 一并 vendored 静态编译，三平台产物自包含；加密参数用 SQLCipher 4 默认值不调参。
# 未设密钥的连接保持明文（SQLCipher 无 key 时行为与标准 SQLite 一致）。
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "trace"] }
rusqlite_migration = "2.6"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.23", features = ["v7", "serde"] }
thiserror = "2.0.18"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt", "macros", "time"] }
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
tracing = "0.1"
# 日志等级运行期 reload（spec #608）：`tracing-subscriber` 的 `reload` 模块在
# std 下无条件可用；本版本（0.3.23）无独立 `reload` feature（可用 features 见解析）。
# 故无需额外开启 feature，直接使用 `tracing_subscriber::reload`。
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tower-http = { version = "0.7", features = ["trace"] }
sha2 = "0.11"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
utoipa = { version = "5", features = ["axum_extras"] }
pinyin = "0.11"

# 主口令本机缓存（issue #574 / ADR-0075 决策 3）：macOS 系统钥匙串 + Touch ID 生物认证门。
# 仅 macOS 目标编译（security-framework 自带 #![cfg(target_vendor = "apple")]
# 空壳，其余平台为不支持桩，见 db/passphrase_cache.rs）；钥匙串/生物认证的
# 运行期行为以手动冒烟清单验收（issue #574 AC），不进 CI 自动测试。
# 刻意不启用 OSX_10_15（use_protected_keychain / 数据保护钥匙串）：macOS 26 对
# 未签名/ad-hoc 进程的无门 DPK 写入同样报 -34018（#662 本机探针实证；先例
# block/buzz#1266），开发回退走传统钥匙串无门条目，勿因「重签稳定」旧论再开。
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
security-framework-sys = "2.17"

[dev-dependencies]
cucumber = "0.23"
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[[test]]
name = "e2e"
harness = false

[lints.clippy]
# 易 panic 构造六件套 deny 门禁（issue #432 / ADR-0060）：门禁约束生产路径；
# 测试目标经 crate 根与集成/BDD 测试 crate 头部 cfg_attr(test, allow) 整体豁免，
# 存量生产 panic 点按 B/C/A 三类逐点豁免安置（清单与纪律见 ADR-0060）。
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

