[package]
name = "nsh-app"
version = "0.11.2"
description = "Ledger 原生壳（NSH）：Linux 桌面唯一产品壳（issue #2017 / ADR-0145；#2083 升根）"
edition = "2024"
publish = false
# 默认可执行文件（包内第二 bin ledger-perf，#2082）：`cargo run` 不带 --bin
# 时指向壳本体。
default-run = "nsh-app"

# bin 单测执行面排除（issue #1787 热点 2）：main.rs 是薄入口（启动参数注入 +
# 平台 run_app），bin 目标零单测，显式声明 test = false 免链免跑；bin 内若新增
# #[test]，scripts/test-exec.ts 的源码扫描守门会变红。逻辑与测试住 lib（boot /
# wiring / app），经 lib 目标进并发测试入口。
#
# 包内第二 bin：性能基准工具 `src/bin/ledger-perf/`（目录型自动发现，保留单测，
# 归 perf-bench.yml 每日基准承接——test-exec.ts 的 EXEMPT_BINS 登记）；headless
# 集成测试经 cargo 注入的 CARGO_BIN_EXE_ledger-perf 消费，同包 bin 由 cargo 随
# 测试构建自带，二进制缺失路径结构上不可能（#2064 触发面）。
[[bin]]
name = "nsh-app"
path = "src/main.rs"
test = false

[dependencies]
# 跨账本汇总编排的连接类型面（#2055）：逐本只读建连与读事务链路上的
# `&Connection` 形面——infra/域栈同版本（0.40）联合特性已由 workspace 成员
# 统一，本依赖只显式给类型名引用，不引入第二份编译面。
rusqlite = "0.40"
# AI 导入 HTTP 壳（api_server 随 #2081 迁居本壳）：axum 路由与服务器启动、
# TraceLayer 请求 span（SQL 耗时归因沿 tower_http）、OpenAPI 契约装配（utoipa）
# 与契约方言投影的正则（出处剥离）。版本与旧壳根包声明一致（双壳并存期
# 同一依赖版本，切轨 #2083 后成为唯一消费方）。
axum = "0.8"
tower-http = { version = "0.7", features = ["trace"] }
utoipa = { version = "5", features = ["axum_extras"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
# HTTP 壳启动期自建 Tokio 运行时（router.rs start_http_server，既有形态随
# 模块迁入；feature 面与旧壳根包声明一致，另加 sync——http_host 失效信号
# 泵的无界通道，#2081）。
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
# NSH 框架经 workspace 精确锁定消费（ADR-0145 决策 2 / issue #2017 AC：0.x 连续
# breaking，升级显式成票；default-features = false 关掉 QuickJS VM，Rust 模式）。
# 平台后端按目标门禁（先例：根包窗口状态插件的 target 三元组条件）——立桩期
# 仅 Linux（硬伤清单的战场）；macOS / Windows 随迁移系列票逐平台开门。
nsh-core.workspace = true
# UI 组件集（issue #2018 首屏表格）：DataTable（虚拟化大表）与 Pagination（分页条）
# 消费面；平台宿主缺省已注册同一组件集（nsh-platform-linux app.rs 缺省 ui_sets =
# nsh_base::registry()），本依赖只是 Rust 侧的组件构造入口，不引入第二份注册。
# headless 测试侧的 ui_sets 由测试显式传入同一 registry（nsh-testing 缺省不带
# nsh-base）。
nsh-base.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux.workspace = true

# 域栈直调面（壳 → 域 → 基础设施单向，ADR-0112）：立桩读路径（交易列表 total）
# 与其全部读时投影接缝（来源列反查 / 出资视图 / 转换两腿）的实现注册侧。
# http feature（issue #1133 门纪律）：AI 导入 HTTP 壳随 #2081 迁居本壳，
# `impl IntoResponse for AppError` 的 axum 投影面由本壳启用；feature 面仅编
# axum（tauri-emit 等 tauri 件已随 #2083 切轨退役，NSH 进程零 tauri）。
ledger-infra = { path = "crates/infra", features = ["http"] }
ledger-transaction = { path = "crates/transaction" }
# 数据期间边界（issue #2021 / ADR-0141 钳制输入）：报表域日期极值读路径
# （旧壳 report_date_range 消费的同一域函数），期间步进的唯一边界来源。
ledger-reports = { path = "crates/reports" }
ledger-accounts = { path = "crates/accounts" }
ledger-categories = { path = "crates/categories" }
ledger-currencies = { path = "crates/currencies" }
ledger-investment = { path = "crates/investment" }
# 持仓标的同步接缝（#2046）：同步编排直调面（旧壳 sync_instrument_info 命令
# 壳消费的同一域编排入口，不经 IPC；壳只依赖域，通道/进度/见证的类型面）。
ledger-market-sync = { path = "crates/market-sync" }
ledger-item = { path = "crates/item" }
ledger-merchants = { path = "crates/merchants" }
ledger-policy = { path = "crates/policy" }
ledger-scheduled = { path = "crates/scheduled" }
# 预算域读写（#2033）：预算视图的进度 / 年度汇总读路径与创建 / 编辑 / 删除
# 写路径直调面（旧壳 budget 族命令消费的同一域函数，不经 IPC）。
ledger-budget = { path = "crates/budget" }
# 净资产总览读（#2039）：概览净资产卡的后端单点取数面（旧壳 dashboard_overview
# 命令消费的同一域读探针，多币种折算与三腿合计全在域内，不经 IPC）。
ledger-dashboard = { path = "crates/dashboard" }
# 储蓄目标域守卫与绑定集读（#2041）：账户删除 / 归档的目标域守卫与目标绑定
# 集读直调面（旧壳 delete_account / archive_account 命令与 savingsGoalProgress
# 命令消费的同一域函数，不经 IPC）。
ledger-savings-goal = { path = "crates/savings-goal" }
# 实物资产域读写（#2049）：实物资产视图的清单读 / 折算合计同源快照与建档 /
# 编辑 / 更新估值 / 处置 / 软删除写路径直调面（旧壳 physicalAsset 域命令消费
# 的同一域函数，不经 IPC；折算与在持合计、日期与金额币种成对守卫全在域内。
ledger-physical-asset = { path = "crates/physical-asset" }
# 备份域直调面（#2038）：手动备份（受管改道判定 + zip 快照）与账本指纹只读
# 判定（旧壳 create_backup / get_book_fingerprint 命令消费的同一域函数，不经
# IPC）。#2054 起兼备份管理面（列表 / 清理 / 自动备份状态 / 恢复）。
ledger-backup = { path = "crates/backup" }
# 多端同步域直调面（#2054）：同步状态 / 手动轮次 / 通道配置 / 检查点 / 引导
#（旧壳 sync_channel 族命令消费的同一域函数，不经 IPC；壳只依赖域，同步协
# 议 crate 面不直接依赖，ADR-0112）。
ledger-sync-engine = { path = "crates/sync-engine" }
# 载荷序列化（导航界面状态的 JSON 形状与旧壳 view_state:* 同形同键，#2032；
# workspace 已有同版本直接依赖，无收束面新增）。
serde_json = "1"
# 行情车道任务的自持异步运行时（#2079）：车道线程用当前线程运行时驱动域
# async 编排（取数腿 tokio IO + 巡检异步定时），反馈桥用无界通道（车道线程
# → 引擎线程泵）；版本随 workspace，特性面只取本壳直接消费的三件。
tokio = { version = "1", features = ["rt", "sync", "time"] }
# 本地日历（期间数学的自然月/季/年边界与「今天」，issue #2021）：域栈多 crate
# 同版本的既有直接依赖（workspace 未收 workspace.dependencies，各成员同版本声明）。
chrono = "0.4.45"
# 性能工具 bin 的确定性摘要（#2082 迁居：src/bin/ledger-perf 的 rng 模块以
# SHA-256 为可种子化 PRNG 的派生熵源；与 infra / sync-engine / transaction
# 同款直接依赖版本，workspace 未收束）。
sha2 = "0.11"
# 备份包内层元数据注入器具（zip_meta，test_support 测试工厂件，ADR-0084）：
# 与旧壳根包同版本直接依赖；测试工厂以 cfg(any(test, feature = "test-utils"))
# 门控编译，生产构建不触碰该模块（依赖统一后归零消费）。
zip = { version = "9", default-features = false, features = ["deflate"] }
# 域栈日志面（tracing 是全仓日志基座，ADR-0006）；启动期 stderr + 日滚文件
# 双输出，RUST_LOG 环境变量过滤。tracing-appender 是日滚与 non_blocking
# WorkerGuard 的载体（#2077 文件面平价，与旧壳同版本）。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[features]
# 测试器具可见性（ADR-0111 决策 5 / issue #1132，根包同款门随 #2081 迁居）：
# 投资五节标题锚点等测试专用导出默认不进生产编译，测试目标经下面的自身
# dev-dependency 启用本 feature 与 `ledger-infra/test-utils`；生产构建不激活
# dev-dependency（resolver 3），故不编译测试器具。
test-utils = ["ledger-infra/test-utils"]

[dev-dependencies]
# 测试器具（ADR-0111 决策 5 / issue #1132，根包同款）：自身 dev-dependency 仅对
# 测试目标启用 `test-utils`，使投资五节锚点再导出与 `ledger_infra::test_utils`
# （GatedEmitter，signal_delivery 集成验证）在测试构建中存在。
nsh-app = { path = ".", features = ["test-utils"] }
# headless 组件测试接缝（docs/research/nsh-testing-capabilities.md 裁决 §2.1 /
# §3.1）：进程内起真实视图树，无窗口无平台后端，进 cargo test 既有泳道；
# 版本随 workspace NSH 锁定（default-features = false 不带 QuickJS）。
nsh-engine.workspace = true
nsh-testing.workspace = true
# 期次状态造数（#2042 headless）：failed 期次前置的构造面（域测试同款
# set_status 语义）需要余额库连接上直接改期次状态——rusqlite 与域栈同版本。
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "trace"] }
# 同步触发接线测试的 S3 桩（#2080）：真 HTTP 轮次现场的本地服务——根包
# test_support/s3.rs 经 tests/support/s3_stub.rs facade 原文载入，只依赖
# std + axum + tokio（不链 tauri，NSH 零 tauri 门不受影响）。特性集对齐根包
# 同款（rt/net/macros/time：桩的 current_thread runtime + TcpListener::from_std）。
axum = "0.8"
tokio = { version = "1", features = ["rt", "net", "macros", "time"] }
# AI 导入 API 集成测试（tests/api_server，#2081 随宿主迁居）：oneshot 驱动
# axum Router（tower util）、响应体收集（http-body-util）、#[tokio::test]（macros）。
# 版本与旧壳根包 dev-dependency 声明一致。
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# 测试 logger 助手（#2109）：log facade 是 NSH 框架错误出口的记录面（nsh-core
# 组件任务失败无 error boundary、nsh-engine host handler panic 等走 log::error!），
# headless 测试进程缺省无 logger、记录静默丢弃——tests/support/test_logger.rs
# 的 opt-in 助手经本依赖实现（stderr + 捕获快照）。版本随依赖树既有解析
#（Cargo.lock 已锁 0.4.35，tracing 传递引入），不新增外部依赖面。
log = "0.4"

# 六件套易 panic 构造门禁经 workspace 继承（ADR-0060 / spec #1086 门禁前置）：
# 本行是继承接线，缺失即门禁静默消失，由 scripts/check-structure.ts 守门。

[profile.dev.package."*"]
debug = false

# 发布产物体积（issue #1999）：release 补 strip + LTO + 单 codegen-unit。cargo 缺省
# release 不 strip 符号表——v0.11.1 Android APK 60.8 MiB 中 22.3 MiB 是 .strtab/.symtab
# 调试符号（对用户零价值），LTO + codegen-units=1 再裁跨 crate 死代码（预期 60.8 →
# ~30 MiB，桌面三平台产物同步受益；代价是 CI release 编译变慢，单次构建接受）。
# 刻意不设两项：
# - panic = "abort"（可再省 ~5.9 MiB unwind 表，否决）：生产代码依赖 catch_unwind
#   保护读事务闭包（crates/infra/src/db/tx_scope.rs、db/facade.rs、
#   src/shell_support/read_entry.rs），abort 会改变 panic 语义；
# - opt-level 维持默认 3："s" 是性能换体积的真实取舍，以 perf-bench 数据决策（#2000）。
[profile.release]
strip = true
lto = true
codegen-units = 1

# workspace 骨架（spec #1086 / issue #1087）：Rust 根升级为 workspace 根，根包就是
# 壳（NSH，#2083 切轨后唯一壳层）；成员 crate 集中在 `crates/` 下，
# 用 glob 纳入——新增成员目录自动成为 workspace 成员，不依赖手工清单。
[workspace]
members = ["crates/*"]
resolver = "3"

# NSH（Native Shell）框架版本锁定（ADR-0145 决策 2 / issue #2017 AC）：上游 0.x
# 三周四版连续 breaking，升级必须显式成票——全部精确版本（`=`）钉死于 workspace
# 声明，成员经 `workspace = true` 消费，`cargo update` 不会漂入新版本。全部
# default-features = false：Rust 模式不带 QuickJS VM（nsh-engine / nsh-platform-linux
# 的 default 含 `js`，ADR-0145 决策 1），nsh-base 的 default 含代码高亮（syntect，
# 立桩消费面用不到）；`nsh-testing` 0.4.0 的 default 不含 QuickJS，测试侧原样消费。
[workspace.dependencies]
nsh-core = { version = "=0.4.0" }
nsh-base = { version = "=0.4.0", default-features = false }
nsh-engine = { version = "=0.4.0", default-features = false }
nsh-platform-linux = { version = "=0.4.0", default-features = false }
nsh-testing = { version = "=0.4.0", default-features = false }

# 易 panic 构造六件套 deny 门禁（issue #432 / ADR-0060）：门禁约束生产路径；
# 测试目标经 crate 根与集成/BDD 测试 crate 头部 cfg_attr(test, allow) 整体豁免，
# 存量生产 panic 点按 B/C/A 三类逐点豁免安置（清单与纪律见 ADR-0060）。
#
# 门禁的**唯一声明处**在 workspace 级 `[workspace.lints.clippy]`：lint 表不跨
# package 自动继承，成员必须显式写 `[lints] workspace = true`——漏写会让门禁
# 静默消失而 clippy 依然全绿。`scripts/check-structure.ts` 的 crate 边界核对
# 对「成员漏继承」与「新成员未登记」做删除即变红的负向守门（ADR-0056 门禁前置）。
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

# 根包同为 workspace 成员，六件套门禁经 workspace 继承（本表即继承接线）。
[lints]
workspace = true
