# CI 后端镜像构建 workflow（issue #1109）：构建并发布 .github/docker/
# backend-ci.Dockerfile 到 GHCR，供 build.yml 的 backend / backend-lint job
# 以 container: 挂载，消除每个 job 的 apt 系统依赖安装固定开销。
#
# 重建路径（「依赖变更后能重建并生效」的验收路径，三入口）：
# 1. Dockerfile 变更：merge 进 main 后本 workflow 的 paths 过滤自动触发重建，
#    下一个 PR 起生效（PR 内的变更在本 PR CI 用旧镜像跑——系统依赖未变则等价，
#    变了则 merge 后重建生效；需要立即验证新依赖时从 PR 分支手动 dispatch）；
# 2. 每周一 cron：跟随 Rust stable 安全更新与基础镜像补丁自动重建；
# 3. 手动 dispatch：Actions → CI Image → Run workflow，可指定任意 ref
#    （PR 分支上改了 Dockerfile 可先 dispatch 发布验证，再 merge）。
#
# 镜像 tag 策略：`:latest`（build.yml 引用的滚动 tag）+ `:sha-<full-sha>`
# （不可变追溯 tag，回滚与 diff 用）。发布后 package 需为 public（首次发布在
# GitHub → Packages 手动切 public，一次性）：public 镜像匿名拉取，fork PR 与
# 无凭据场景零配置；设 private 则所有 PR CI 拉取都要接凭据，得不偿失。
# 层缓存走 type=gha：apt 清单与 rustup 版本不变时重建走缓存层，秒级完成。

name: CI Image

concurrency:
  group: ci-image
  cancel-in-progress: false # 发布中途取消会产生半发布状态，排队等待而非打断

on:
  push:
    branches: [main]
    paths:
      - '.github/docker/backend-ci.Dockerfile'
      - '.github/workflows/ci-image.yml'
  schedule:
    # 每周一 02:23 UTC（北京时间 10:23，避开整点调度高峰）
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: 构建并发布后端 CI 镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # github.repository_owner 当前为全小写 asiazhang，满足 registry 名称
      # 必须 lowercase 的要求；若未来 owner 出现大写需先显式小写化。
      IMAGE: ghcr.io/${{ github.repository_owner }}/ledger-ci-backend
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .github/docker
          file: .github/docker/backend-ci.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 冒烟校验（镜像重建路径可用性的门）：工具链四件套 + 关键系统库
      # pkg-config 发现均可用才算发布成功，坏镜像不进 :latest 的消费方。
      - name: 镜像冒烟校验
        run: |
          docker run --rm "$IMAGE" bash -c '
            set -euo pipefail
            rustc --version
            cargo --version
            rustfmt --version
            cargo clippy --version
            mold --version
            pkg-config --modversion webkit2gtk-4.1 gtk+-3.0 ayatana-appindicator3-0.1 librsvg-2.0
            git --version
          '
