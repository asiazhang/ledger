# 性能基准 workflow（issue #462）：与主构建 workflow（build.yml，push/PR 触发）
# 刻意分离——本 workflow 只在每周 cron 与手动 dispatch 时运行：
#   现场生成 50 万笔基准库（ledger-perf generate，seed 42）→ 跑 10 项查询基准
#   （ledger-perf bench）→ Markdown 耗时报告写入 $GITHUB_STEP_SUMMARY。
# 只记录不判定（ADR-0062 观察期）：无性能阈值、无失败门禁；阈值机制等基线
# 分布稳定后另立决策。
# 手动验证入口：Actions → Perf Bench → Run workflow（端到端约一次 release
# 冷编译 + 秒级生成 + 分钟级基准）。

name: Perf Bench

on:
  schedule:
    # 每周一 01:17 UTC（北京时间 09:17，避开整点调度高峰）
    - cron: '17 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-bench
  cancel-in-progress: false

jobs:
  bench:
    name: 性能基准（生成 + bench + summary）
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Linux 系统依赖（tauri 编译所需）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 编译 ledger-perf（release）
        working-directory: src-tauri
        run: cargo build --release --bin ledger-perf

      - name: 现场生成 50 万笔基准库（generate，seed 42）
        working-directory: src-tauri
        run: |
          START=$(date +%s)
          ./target/release/ledger-perf generate
          echo "GENERATE_SECONDS=$(($(date +%s) - START))" >> "$GITHUB_ENV"

      - name: 运行查询基准（bench，10 项 × min/avg/p95）
        working-directory: src-tauri
        shell: bash
        run: |
          set -o pipefail
          ./target/release/ledger-perf bench | tee bench-report.txt

      - name: 写入 Job Summary（Markdown 耗时报告）
        if: always()
        run: |
          {
            echo "## ledger-perf 查询基准报告"
            echo
            echo "- 触发：${{ github.event_name }} @ ${{ github.sha }}"
            echo "- 生成耗时：${GENERATE_SECONDS:-未知}s（50 万笔，seed 42）"
            echo
            if [ -f src-tauri/bench-report.txt ]; then
              ./scripts/perf-summary.sh src-tauri/bench-report.txt
            else
              echo '> ⚠️ bench 未产出报告（bench 步骤失败，详见上方日志）'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
