# 性能基准 workflow（issue #462；门禁 issue #493 / ADR-0068）：与主构建
# workflow（build.yml，push/PR 触发）刻意分离——本 workflow 只在每周 cron
# 与手动 dispatch 时运行：
#   现场生成 50 万笔基准库（ledger-perf generate，seed 42）→ 跑 10 项查询
#   基准（ledger-perf bench --iterations 20 --max-p95-ms 200）→ Markdown 耗时
#   报告写入 $GITHUB_STEP_SUMMARY。
# ADR-0062 观察期已结束，门禁生效（ADR-0068）：全部 10 项基准逐项判定
# p95 ≤ 200ms，任何一项超标 bench 以非零退出、job 失败（超标清单随报告
# 进 Summary）。不在 PR 上跑：一次 release 冷编译 + 生成 + 基准 ≈ 47 分钟，
# 回归由每周基线与性能批合入后的手动触发拦截。ADR-0009 的 100ms 慢查询
# 告警线（SQL 级观测）保留不动，与本门禁（基准项级判定）是两个层次。
# 手动验证入口：Actions → Perf Bench → Run workflow。

name: Perf Bench

on:
  schedule:
    # 每周一 01:17 UTC（北京时间 09:17，避开整点调度高峰）
    - cron: '17 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-bench
  cancel-in-progress: false

jobs:
  bench:
    name: 性能基准（生成 + bench + summary）
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Linux 系统依赖（tauri 编译所需）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 编译 ledger-perf（release）
        working-directory: src-tauri
        run: cargo build --release --bin ledger-perf

      - name: 现场生成 50 万笔基准库（generate，seed 42）
        working-directory: src-tauri
        run: |
          START=$(date +%s)
          ./target/release/ledger-perf generate
          echo "GENERATE_SECONDS=$(($(date +%s) - START))" >> "$GITHUB_ENV"

      - name: 运行查询基准（bench，10 项 × min/avg/p95 + 门禁 p95 ≤ 200ms）
        id: bench
        working-directory: src-tauri
        shell: bash
        run: |
          set -o pipefail
          # --iterations 20：n=10 时最近秩 p95 恒等于 max，20 次才成真分位数；
          # --max-p95-ms 200：ADR-0068 门禁，超标即非零退出（pipefail 保持步骤红）。
          ./target/release/ledger-perf bench --iterations 20 --max-p95-ms 200 | tee bench-report.txt

      - name: 写入 Job Summary（Markdown 耗时报告 + 门禁结果）
        if: always()
        run: |
          {
            echo "## ledger-perf 查询基准报告"
            echo
            echo "- 触发：${{ github.event_name }} @ ${{ github.sha }}"
            echo "- 生成耗时：${GENERATE_SECONDS:-未知}s（50 万笔，seed 42）"
            if [ "${{ steps.bench.outcome }}" = "success" ]; then
              echo "- 门禁：✅ 通过 —— 全部 10 项 p95 ≤ 200ms（ADR-0068）"
            else
              echo "- 门禁：❌ 失败 —— 存在基准 p95 超 200ms（ADR-0068），超标清单见报告尾部门禁行"
            fi
            echo
            if [ -f src-tauri/bench-report.txt ]; then
              ./scripts/perf-summary.sh src-tauri/bench-report.txt
            else
              echo '> ⚠️ bench 未产出报告（bench 步骤失败，详见上方日志）'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
