name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # CI 耗时基线（2026-09-13，issue #1110 刷新）：来源 = 7 次成功 PR 运行（run
  # 34747049405 / 34747417399 / 34747480095 / 34747583723 / 34748550902 /
  # 34748847869 / 34749024124），runner 画像 = ubuntu-latest（Linux x64，4 vCPU，
  # GitHub 托管）。backend / backend-lint 挂预构建容器镜像（#1109，apt 已归零），
  # `Initialize containers` 步骤实测：backend job 19–31s、backend-lint job 20–32s
  # （两 job 各自实测，不互相外推）。实测（同批 7 次运行）：backend 后端测试
  # 258–306s（典型 ~271s）｜backend-lint 静态检查 81–96s｜frontend-test 分片
  # 112–189s（典型 ~170s）｜frontend 检查 39–87s。关键路径 = 后端测试 job（前端分片
  # 不再是决定项），PR 端到端 ≈ 4.3–5.1 分钟（job 跨度口径，不含排队）。
  # 后端测试 job 的四段拆解与「180s 不可达 / 250s 乐观下界」推算（对外口径单点，含
  # 下界数字）住 backend job 注释；逐 run 实测数据与口径定义随 issue #1110 存档
  # （验收记录不进仓库，git 历史可回溯）。
  # issue #1109 起，backend/backend-lint 挂预构建 CI 镜像（ci-image.yml 发布到
  # GHCR），job 内零 apt 安装；镜像内容与重建路径见 .github/docker/backend-ci.Dockerfile 头注。

  # 前端构建与一致性检查：vue-tsc 类型检查（前端 + 守门脚本与测试两个工程）+ oxlint lint
  # （--deny-warnings，与本地 check.sh 同门槛）+ oxfmt 格式检查（--check，与本地 check.sh
  # 同门槛，issue #1519 / ADR-0128）+ vite build + 守门脚本（Bun 运行时，ADR-0083）；
  # 2026-09-13 基线（7 次 PR 运行，run 34747049405–34749024124）39–87s，典型 ~50s。
  # 测试拆至 frontend-test 分片 job，二者并行。
  frontend:
    name: 前端检查
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      # 守门脚本运行时 = Bun（ADR-0083）；版本与本地门槛同一固定值，升级走显式 bump
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: pnpm run build

      - name: 守门脚本与测试类型检查
        run: pnpm exec vue-tsc -p tsconfig.scripts.json --noEmit

      - name: 前端 lint
        run: pnpm exec oxlint --deny-warnings

      - name: 前端格式检查
        run: pnpm exec oxfmt --check .

      - name: 版本元数据一致性检查
        run: bun scripts/check-versions.ts

      - name: 结构守门检查
        run: bun scripts/check-structure.ts

      - name: 前端结构守门检查
        run: bun scripts/check-frontend-structure.ts

      # 测试执行覆盖守门（issue #1112）：并发入口（scripts/test-exec.ts）与非并发
      # 入口（scripts/test.sh 的 e2e + doc-test）的覆盖范围必须与工作区测试目标
      # 清单全等——新增测试目标不静默漏跑。纯静态发现（manifest + 目录形态），
      # 不需 Rust 工具链，故与本 job 的其余守门同址。挂载接线核对归守门接线测试
      # （scripts/gate-mounts.test.ts，登记住 scripts/gate-mounts.ts 守门挂载登记，
      # issue #1682）：删除本步骤即变红；守门自身
      # 保留等价性规则（测试运行期读 cargo 注入环境变量即红，
      # scripts/test-exec.test.ts）。
      - name: 测试执行覆盖守门
        run: bun scripts/test-exec.ts check

      - name: 前端异步守门
        run: bun scripts/check-async-guards.ts

      # 守门脚本测试（issue #1991）：scripts/*.test.ts 的唯一运行口径 = bun test
      # （测试经 spawnSync('bun') 依赖 bun 在 PATH，vitest 收集范围自此不含
      # scripts/，ADR-0083 双运行时边界收严）；挂载登记归 scripts/gate-mounts.ts，
      # 删除本步骤即红。
      - name: 守门脚本测试
        run: bun test scripts/

      - name: 文档一致性检查
        run: ./scripts/check-docs.sh

      # 全仓无 tauri 守门（issue #2083 / ADR-0145 决策 4/7）：清单形状 + 前端死
      # 路径面（命令型依赖图门在 backend-lint 的 cargo tree）。bun 纯源码扫描，
      # 无需 Rust 工具链，与本 job 的其余守门同址。
      - name: 全仓无 tauri 守门
        run: bun scripts/check-no-tauri.ts

      # issue #1682 CI 执行面补齐：7 个此前仅在本地 check.sh 的 TS 门补挂本 job
      # 尾部（均为秒级 bun 纯源码扫描，无需 Rust 工具链），不改 check.sh 既有
      # 顺序与依赖语义；挂载登记与「删除即变红」核对住 scripts/gate-mounts.ts /
      # scripts/gate-mounts.test.ts（守门挂载登记 + 守门接线测试）。
      - name: 基础设施账本数据表 DML 禁令
        run: bun scripts/check-infra-dml.ts

      - name: 东财行情面端点零残留源码扫描
        run: bun scripts/check-eastmoney-residue.ts

      - name: 样式块守门检查
        run: bun scripts/check-style-blocks.ts

      # 壳根包裸字号直调零残留守门（issue #2108 / spec #2099 / ADR-0147 决策 4）：
      # 视图零裸值纪律源码扫描，bun 纯源码扫描，无需 Rust 工具链，与本 job 同址。
      - name: 壳根包裸字号直调零残留扫描
        run: bun scripts/check-bare-font-size.ts

      - name: i18n key 全等检查
        run: bun scripts/check-i18n-keys.ts

      - name: 弹窗表单节奏守门
        run: bun scripts/check-dialog-forms.ts

      - name: 测试桩守门检查
        run: bun scripts/check-test-stubs.ts

      - name: Rust 测试守门检查
        run: bun scripts/check-test-support.ts

  # 前端测试按 shard 均分到 2 个并行 runner：拆分前 vitest 单 job 208s（累计 586s）。
  # 2026-09-13 基线（同批 7 次 PR 运行）：分片 1/2 126–189s、分片 2/2 112–175s——
  # 两片不再均衡（分片成本受文件分布与 runner 波动双重影响），但都远低于后端测试
  # job，不在关键路径上。不采用 isolate:false（worker 复用 jsdom 省每文件环境创建），
  # 因 pinia/i18n/fake timers 等模块级单例跨文件泄漏风险不可控，放弃该项收益。
  frontend-test:
    name: 前端测试（shard ${{ matrix.shard }}/2）
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Vitest 分片运行
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/2

  # 后端测试：fmt/clippy 拆至 backend-lint 并行（clippy 仅 ~20–30s，不值得占关键路径）。
  #
  # 端到端基线（2026-09-13，issue #1110 刷新）：258–306s，典型 ~271s（来源 = 7 次
  # 成功 PR 运行 run 34747049405–34749024124；runner 画像 = ubuntu-latest Linux x64
  # 4 vCPU + 本 job 的预构建容器镜像；rust-cache 精确 key 命中，依赖缓存
  # 1.14–1.18 GB）。四段拆解（口径定义与逐 run 表随 issue #1110 存档，不进仓库）：
  # 容器初始化（镜像拉取）
  # 19–31s｜缓存恢复（下载+解压）30–42s｜编译 82–116s｜测试执行 102–121s；四段之和
  # 比端到端少 5–9s，差额是 setup/checkout/Post/stop containers 等固定开销。
  #
  # 目标与不可达结论（spec #1086）：目标 job ≤250s，180s 只作方向。四条硬约束：
  # ① 不加付费 larger runner；② 不缩减 CI 测试范围（不按路径过滤、e2e 不挪 nightly）；
  # ③ 不引入 rustc-wrapper 类方案（编译加速归 kache）；④ 默认不拆后端测试为多 job。
  # 「180s 不可达」推算（单一口径 = 四段各自最小观测值之和，不含残差；极值出处见
  # issue #1110 的逐 run 表）：19（容器）+ 30（缓存）+ 82（编译）+ 102（执行）= 233s，
  # 已高于 180s 达 53s；同一口径计入残差 5–9s 则为 238–242s，结论不变。且每段都被
  # 约束锁死——执行段由约束②固定（时间就是用例本身），容器/缓存段是每 job 必付固定
  # 开销（约束④禁止用拆 job 摊薄，拆了要重复付），编译段在约束①（4 核 runner）与
  # ③（唯一数量级工具=kache，CI 侧已被否决）下已无同量级可压项。250s 同口径 =
  # 233s + 残差 5–9s ≈ 238–242s，需要各段同时接近最小观测值才成立（7 次运行中仅 1 次
  # 达 258s，其余 266–306s），故 250s 是乐观下界而非稳态目标；本结论写回注释即为
  # 止损点，后续不再追逐 180s。
  #
  # issue #1109：系统依赖（tauri 库 + mold + Rust stable 工具链）改由预构建镜像
  # 承载（ci-image.yml 发布，Dockerfile 见 .github/docker/backend-ci.Dockerfile），
  # job 内零安装步骤——改前 apt 阶段 20–98s 波动（缓存命中也有 22–28s），改后 0s
  # （其成本移入上面的容器初始化段）。
  backend:
    name: 后端测试（Rust 单测 + BDD/e2e）
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    # 镜像 tag 刻意写死 upstream 路径：fork PR 匿名拉上游公开镜像即可，无需
    # fork 自建 package（repository 表达式在 fork PR 会指向 fork，镜像不存在）。
    # 镜像 public 化（匿名拉取）是 ci-image.yml 首次发布后的一次性手动步骤。
    container:
      image: ghcr.io/asiazhang/ledger-ci-backend:latest
    defaults:
      run:
        working-directory: src-app
    # CI 提速（仅 CI，本地开发不受影响）：
    # - CARGO_PROFILE_DEV_DEBUG=0：CI 侧不带 debuginfo（issue #1110）。作用面只有
    #   workspace 成员——
    #   依赖的 debuginfo 由 Cargo.toml 的 [profile.dev.package."*"] 固定为
    #   line-tables-only，不受本变量影响。代价：CI 失败时 backtrace 只有符号名、
    #   没有行号（断言位置仍由测试输出给出）；本地不设本变量（默认 debuginfo=2
    #   全量符号），调试体验不变。
    #   收益边界（本票实测，勿重复追逐）：只省编译/链接时间，**不省缓存体积与解压
    #   时间**——rust-cache 保存前把 workspace 成员产物整体剔出（只缓存依赖产物，
    #   其 save.ts 取「workspace 根之外的包」再清理 target），依赖的 debuginfo 又已被
    #   [profile.dev.package."*"] 钉在 line-tables-only，故本变量对缓存体积零影响。
    #   直接证据：main run 34749230834 里 16 个成员 crate 全量冷编（debug=1）后，
    #   Post 保存 1236735941 B 与恢复的 1236768034 B 基本等大（成员 debuginfo 从未
    #   进过缓存）。spec #1086 里「缓存 2 GB → 约 1 GB、解包砍半」的预期不成立，
    #   那 2.0 GB 是依赖侧 line-tables-only（db611ca7，2026-09-06）之前的历史值。
    #   一次性代价（实测，别按「只省 10–20s」估）：CARGO_ 前缀环境变量进入
    #   rust-cache 的 **restore key** hash，本变量改动使 env hash 259c68f2 →
    #   7392abf3（run 34751213388 的 Cache Configuration），与旧缓存前缀不匹配 ⇒
    #   带本改动的分支下一次运行是**全量冷编**（依赖也重编）：实测该 run 缓存恢复
    #   1s（miss）、编译 5m36s、job 8m11s；merge 后首个 main 运行同价，之后新 key
    #   缓存固化、恢复稳态。影响面仅限带本改动的分支与 merge 后首个 main 运行——
    #   其它 PR 的 env hash 不变（其余 job 亦然，backend-lint 未设本变量）。
    #   备选（可省掉这次冷编，留给维护者取舍）：把本变量降为 cargo 步骤级 env，
    #   env hash 保持 259c68f2；依赖产物与本变量无关（见上），缓存内容不受影响，
    #   代价是该变量不再出现在 rust-cache 的「Environment considered」里。
    # - RUSTFLAGS + mold：链接器换 mold（lib 与每个集成测试 crate 各全量链接一次，
    #   链接是 workspace 编译的大头），mold 已烘进镜像。
    # - 增量编译（issue #1110 实测否决，刻意不设 CARGO_INCREMENTAL）：rust-cache
    #   （@v2，CI 实测解析到 v2.9.2 / SHA 6323deb1）在 restore 阶段固定导出
    #   CARGO_INCREMENTAL=0，保存前又删除增量产物，故 CI 每次
    #   运行都从零增量状态开始，同一 job 内每个 crate 只编一次——没有复用机会，只多付
    #   写增量产物的成本。本机同内容同 target dir 对照：inc=0 CPU 152.5s、inc=1
    #   CPU 173.5s（+14%），增量产物 1.7 GB（≈ 现有依赖缓存的 1.5 倍，要跨运行复用
    #   就得连它一起缓存）。本地热回路由 kache 承担（.kache.toml preserve_incremental，
    #   workspace 全量重编命中缓存 4.6s），不需要 CI 侧开启。
    # - 刻意不用 OPT_LEVEL=1：实测（run 33975823593）负优化——workspace 大 crate
    #   的优化 pass 使编译 76s→2m43s，执行只省 ~14s，净 +60s，已回退。
    # 注意：RUSTFLAGS/debug 变更会使 cargo fingerprint 失效，变更后首跑全量冷编译
    # 一次（一次性成本），之后 rust-cache 恢复稳态。
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 换镜像起前缀隔离（issue #1109）：旧缓存是在宿主 runner 上编译的，与
          # 镜像内工具链/链接器产物彻底分层，避免宿主产物混进容器执行；切换后
          # 首跑一次冷编译（一次性成本）。
          prefix-key: ci-image
          # 只允许 main 维护缓存（CI 实测 2026-09，run 34745147580 等）：PR 改
          # workspace 的 Cargo.toml（域拆 crate 系列）即 key 精确 miss，Post 阶段
          # 冗余重存 ~1.1 GB（压包 + 上传）2m17–2m43；PR 恢复不受影响——经
          # restore-key 回退拿到 base 分支的缓存，merge 后新 key 自然固化进缓存。
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # 范围显式 `--workspace`（spec #1086 / issue #1087）：非虚拟 workspace 下 cargo
      # 默认只作用于根包，缺范围参数会静默漏跑成员 crate；cargo 对没有对应 target
      # 的成员自动跳过，故 `--lib --test '*'` 的组合对成员 crate 安全。
      # 显式 target 选择：lib + 全部集成 target（tests/ 下每个 *.rs 与 */main.rs 各一个
      # crate，当前 api_server / e2e / commands / real_bucket_acceptance /
      # sync_trigger_poll）。`--test` 的名称支持 Unix glob（cargo 文档明确要求单引号
      # 防 shell 展开），`'*'` 命中全部集成 target 而不含 bin——新增集成 target 自动
      # 进 CI，无「手工清单漏项静默漏跑」的坑（issue #988）。刻意不用 `--tests`：它会
      # 连带 bin 测试，把 ledger-perf 的生成器正确性单测（属性能工具链，perf-bench.yml
      # 域，随每日常规基准一起运行）拖回 PR CI。副作用：显式 target 选择不跑 doc-tests
      # （issue #1112 起的口径：本仓 doc-test 目标 17 个、当前有 4 条实际执行；CI 这里
      # 仍不跑，本地 scripts/test.sh 已补 `cargo test --workspace --doc`）。
      - name: Rust 单元测试 + BDD/e2e 测试（cucumber）
        run: cargo test --workspace --lib --test '*'

  # 后端静态检查：与 backend job 同挂预构建镜像（issue #1109），fmt/clippy 组件
  # 已烘进镜像，job 内零安装步骤（改前 apt 阶段缓存命中也有 22s）。
  # 刻意不设 CARGO_PROFILE_DEV_DEBUG（issue #1110）：clippy 走 check 形态——只产出
  # metadata、不 codegen，debuginfo 水平既不改其耗时也几乎不改其缓存体积，设了只会
  # 白换一次缓存 key（本 job 不在 PR 关键路径上，收益为零）。
  backend-lint:
    name: 后端静态检查（fmt + clippy）
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    # 镜像 tag 刻意写死 upstream 路径，理由同 backend job。
    container:
      image: ghcr.io/asiazhang/ledger-ci-backend:latest
    defaults:
      run:
        working-directory: src-app
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 前缀隔离理由同 backend job（issue #1109）。
          prefix-key: ci-image
          # 只允许 main 维护缓存，理由同 backend job：key miss 时 Post 冗余重存
          # ~977 MB 走 2 分钟级（run 34745896185 实测）。
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 格式检查
        run: cargo fmt --all --check

      - name: Clippy 检查
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # gate-off 编译门（issue #1133 / #1473）：clippy 走 --all-features（http 门恒开、
      # axum 恒在），门内 cfg 恒被编译——infra 默认 feature 不含 axum 的 gate-off
      # 形态只有 `cargo check -p ledger-infra` 核到：error.rs 在无 axum 依赖图下
      # 必须独立成立。与本地 check.sh 同门槛（删步骤即红：守门接线测试
      # scripts/gate-mounts.test.ts，issue #1682）。
      - name: gate-off 编译门（ledger-infra 默认 feature）
        run: cargo check -p ledger-infra

      # 全仓无 tauri 守门（issue #2083 / ADR-0145 决策 4/7，#2074 零链接门升级）：
      # tauri 不在任何 workspace 成员依赖图 = cargo tree -i 报 did not match——
      # grep 命中即绿；tauri 在图（要抓的回归）或其他 cargo 失败 grep 不中即红
      #（fail-closed，与本地 check.sh 同一命令；删步骤即红：守门接线测试
      # scripts/gate-mounts.test.ts，issue #1682）。
      - name: 全仓无 tauri 守门（cargo tree，依赖图面）
        run: cargo tree --workspace -i tauri --edges normal 2>&1 | grep -q "did not match any packages"

      # 基础设施 rustdoc 门禁（issue #1139）：intra-doc link 漂移等 rustdoc 告警
      # 不被 clippy/fmt 拦截，单独用 cargo doc -D warnings 清零。范围锁定
      # ledger-infra（首装归零的 crate，--no-deps 只 rustdoc 本 crate，增量成本低）；
      # 与本地 check.sh 同门槛（删步骤即红：守门接线测试 scripts/gate-mounts.test.ts，
      # issue #1682）。
      - name: 基础设施 rustdoc 门禁
        run: RUSTDOCFLAGS='-D warnings' cargo doc -p ledger-infra --no-deps

  # Linux 发布构建（issue #2083 / ADR-0145 决策 1/7 修订）：切轨后唯一平台 =
  # Linux 桌面；NSH 壳是纯 Rust 产物（无 WebView 打包面），发布形态 = release
  # 二进制 + .desktop 直跑（说明住 README「安装与直跑」）。AppImage / deb 打包
  # 接 CI 属范围外（ADR-0145 决策 7 修订：Linux 打包自建，另票承接）；macOS /
  # Windows / Android 产物与更新器矩阵（原 release 四行矩阵 + latest.json 装配）
  # 随 Tauri 壳退役删除，自动更新下线（ADR-0124 / ADR-0145 决策 7）。
  # workflow_dispatch 可在正式 tag 前手动试跑；产物经 upload-artifact 供手工
  # 下载验收（不做 GitHub Release 自动发布——发布入口另行裁决）。
  linux-build:
    name: Linux 构建（release 二进制）
    if: "startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-app

      # NSH 壳系统依赖（GTK4）：与 backend-ci 镜像的 apt 清单同源语义（#1109）；
      # release 构建是原生 runner，无法挂 Linux 容器镜像，保留独立安装。
      - name: 安装 Linux 系统依赖（GTK4）
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev

      - name: 构建 release 二进制
        working-directory: src-app
        run: cargo build --release --bin nsh-app

      - name: 收集发布产物
        uses: actions/upload-artifact@v7
        with:
          name: ledger-nsh-linux-x64
          path: src-app/target/release/nsh-app
          if-no-files-found: error
