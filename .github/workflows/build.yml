name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # CI 耗时基线（2026-09-13，issue #1110 刷新）：来源 = 7 次成功 PR 运行（run
  # 34747049405 / 34747417399 / 34747480095 / 34747583723 / 34748550902 /
  # 34748847869 / 34749024124），runner 画像 = ubuntu-latest（Linux x64，4 vCPU，
  # GitHub 托管），backend / backend-lint 挂预构建容器镜像（#1109，apt 已归零，
  # 改为每 job 的容器初始化 19–31s），rust-cache 精确 key 命中（依赖缓存
  # 1.14–1.18 GB）。实测（同批 7 次运行）：backend 后端测试 258–306s（典型 ~271s）
  # ｜backend-lint 静态检查 81–96s｜frontend-test 分片 112–189s（典型 ~170s）
  # ｜frontend 检查 39–87s。关键路径 = 后端测试 job（前端分片不再是决定项），
  # PR 端到端 ≈ 4.3–5.1 分钟（job 跨度口径，不含排队）。
  # 后端测试 job 的四段拆解、逐 run 表与「250s / 180s」推算见 backend job 注释；
  # 数据、口径与局限见 docs/verification/1110-ci-compile-cache-baseline.md。
  # issue #1109 起，backend/backend-lint 挂预构建 CI 镜像（ci-image.yml 发布到
  # GHCR），job 内零 apt 安装；镜像内容与重建路径见 .github/docker/backend-ci.Dockerfile 头注。

  # 前端构建与一致性检查：vue-tsc 类型检查（前端 + 守门脚本与测试两个工程）+ oxlint lint
  # （--deny-warnings，与本地 check.sh 同门槛）+ vite build + 守门脚本（Bun 运行时，ADR-0083）；
  # 2026-09-13 基线（7 次 PR 运行，run 34747049405–34749024124）39–87s，典型 ~50s。
  # 测试拆至 frontend-test 分片 job，二者并行。
  frontend:
    name: 前端检查
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      # 守门脚本运行时 = Bun（ADR-0083）；版本与本地门槛同一固定值，升级走显式 bump
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: pnpm run build

      - name: 守门脚本与测试类型检查
        run: pnpm exec vue-tsc -p tsconfig.scripts.json --noEmit

      - name: 前端 lint
        run: pnpm exec oxlint --deny-warnings

      - name: 命令注册一致性检查
        run: bun scripts/check-commands.ts

      - name: 结构守门检查
        run: bun scripts/check-structure.ts

      - name: 前端结构守门检查
        run: bun scripts/check-frontend-structure.ts

      - name: 后台服务成对拉起守门
        run: bun scripts/check-background-services.ts

      - name: 前端异步守门
        run: bun scripts/check-async-guards.ts

      - name: 文档一致性检查
        run: ./scripts/check-docs.sh

  # 前端测试按 shard 均分到 2 个并行 runner：拆分前 vitest 单 job 208s（累计 586s）。
  # 2026-09-13 基线（同批 7 次 PR 运行）：分片 1/2 126–189s、分片 2/2 112–175s——
  # 两片不再均衡（分片成本受文件分布与 runner 波动双重影响），但都远低于后端测试
  # job，不在关键路径上。不采用 isolate:false（worker 复用 jsdom 省每文件环境创建），
  # 因 pinia/i18n/fake timers 等模块级单例跨文件泄漏风险不可控，放弃该项收益。
  frontend-test:
    name: 前端测试（shard ${{ matrix.shard }}/2）
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      # 守门脚本测试经 spawnSync('bun', …) 同运行时调用（ADR-0083），需安装 bun
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Vitest 分片运行
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/2

  # 后端测试：fmt/clippy 拆至 backend-lint 并行（clippy 仅 ~20–30s，不值得占关键路径）。
  #
  # 端到端基线（2026-09-13，issue #1110 刷新）：258–306s，典型 ~271s（7 次成功 PR
  # 运行，run 34747049405–34749024124；runner 画像 = ubuntu-latest Linux x64 4 vCPU
  # + 本 job 的预构建容器镜像；rust-cache 精确 key 命中，依赖缓存 1.14–1.18 GB）。
  # 四段（逐 run 表见 docs/verification/1110-ci-compile-cache-baseline.md）：容器
  # 初始化（镜像拉取）19–31s｜缓存恢复（下载+解压）30–42s｜编译 82–116s｜测试执行
  # 102–121s；四段之和比端到端少 5–9s，差额是 setup/checkout/Post/stop containers
  # 等固定开销。编译段口径 = `Finished test profile … in 1m22s–1m56s`；
  # 执行段 = 首个测试二进制启动到 e2e 汇总，明细（2026-09-13 时点）：lib 单测 1229
  # 用例分 16 个成员 crate + 根包共 17 个二进制（合计 ~51s）、api_server 236 用例 11s、
  # commands 19 用例 6s、e2e 451 场景 3122 步 ~53s、sync_trigger_poll 1 用例 ~0s。
  #
  # 目标与不可达结论（spec #1086）：目标 job ≤250s，180s 只作方向。四条硬约束：
  # ① 不加付费 larger runner；② 不缩减 CI 测试范围（不按路径过滤、e2e 不挪 nightly）；
  # ③ 不引入 rustc-wrapper 类方案（编译加速归 kache）；④ 默认不拆后端测试为多 job。
  # 180s 不可达推算：取本基线四段各自的最小观测值相加 = 19（容器）+ 30（缓存）
  # + 82（编译）+ 102（执行）= 233s，已高于 180s 达 53s；且每段都被约束锁死——
  # 执行段由约束②固定（时间就是用例本身），容器/缓存段是每 job 必付固定开销
  # （约束④禁止用拆 job 摊薄，拆了要重复付），编译段在约束①（4 核 runner）与
  # ③（唯一数量级工具=kache，CI 侧已被否决）下已无同量级可压项。250s 对应的是
  # 233s + 残差（≈6–9s）≈ 240–242s 这一统计下界：需要各段同时接近最小观测值才成立
  # （7 次运行中仅 1 次达 258s，其余 266–306s），故 250s 是乐观下界而非稳态目标；
  # 本结论写回注释即为止损点，后续不再追逐 180s。
  #
  # issue #1109：系统依赖（tauri 库 + mold + Rust stable 工具链）改由预构建镜像
  # 承载（ci-image.yml 发布，Dockerfile 见 .github/docker/backend-ci.Dockerfile），
  # job 内零安装步骤——改前 apt 阶段 20–98s 波动（缓存命中也有 22–28s），改后 0s
  # （其成本移入上面的容器初始化段）。
  backend:
    name: 后端测试（Rust 单测 + BDD/e2e）
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    # 镜像 tag 刻意写死 upstream 路径：fork PR 匿名拉上游公开镜像即可，无需
    # fork 自建 package（repository 表达式在 fork PR 会指向 fork，镜像不存在）。
    # 镜像 public 化（匿名拉取）是 ci-image.yml 首次发布后的一次性手动步骤。
    container:
      image: ghcr.io/asiazhang/ledger-ci-backend:latest
    defaults:
      run:
        working-directory: src-tauri
    # CI 提速（仅 CI，本地开发不受影响）：
    # - CARGO_PROFILE_DEV_DEBUG=0：CI 侧不带 debuginfo（issue #1110）。作用面只有
    #   workspace 成员——
    #   依赖的 debuginfo 由 Cargo.toml 的 [profile.dev.package."*"] 固定为
    #   line-tables-only，不受本变量影响。代价：CI 失败时 backtrace 只有符号名、
    #   没有行号（断言位置仍由测试输出给出）；本地不设本变量（默认 debuginfo=2
    #   全量符号），调试体验不变。
    #   收益边界（本票实测，勿重复追逐）：只省编译/链接时间，**不省缓存体积与解压
    #   时间**——rust-cache 保存前把 workspace 成员产物整体剔出（只缓存依赖产物，
    #   其 save.ts 取「workspace 根之外的包」再清理 target），依赖的 debuginfo 又已被
    #   [profile.dev.package."*"] 钉在 line-tables-only，故本变量对缓存体积零影响。
    #   直接证据：main run 34749230834 里 16 个成员 crate 全量冷编（debug=1）后，
    #   Post 保存 1236735941 B 与恢复的 1236768034 B 基本等大（成员 debuginfo 从未
    #   进过缓存）。spec #1086 里「缓存 2 GB → 约 1 GB、解包砍半」的预期不成立，
    #   那 2.0 GB 是依赖侧 line-tables-only（db611ca7，2026-09-06）之前的历史值。
    #   一次性代价（实测，别按「只省 10–20s」估）：CARGO_ 前缀环境变量进入
    #   rust-cache 的 **restore key** hash，本变量改动使 env hash 259c68f2 →
    #   7392abf3（run 34751213388 的 Cache Configuration），与旧缓存前缀不匹配 ⇒
    #   带本改动的分支下一次运行是**全量冷编**（依赖也重编）：实测该 run 缓存恢复
    #   1s（miss）、编译 5m36s、job 8m11s；merge 后首个 main 运行同价，之后新 key
    #   缓存固化、恢复稳态。影响面仅限带本改动的分支与 merge 后首个 main 运行——
    #   其它 PR 的 env hash 不变（其余 job 亦然，backend-lint 未设本变量）。
    #   备选（可省掉这次冷编，留给维护者取舍）：把本变量降为 cargo 步骤级 env，
    #   env hash 保持 259c68f2；依赖产物与本变量无关（见上），缓存内容不受影响，
    #   代价是该变量不再出现在 rust-cache 的「Environment considered」里。
    # - RUSTFLAGS + mold：链接器换 mold（lib 与每个集成测试 crate 各全量链接一次，
    #   链接是 workspace 编译的大头），mold 已烘进镜像。
    # - 增量编译（issue #1110 实测否决，刻意不设 CARGO_INCREMENTAL）：rust-cache
    #   （@v2，CI 实测解析到 v2.9.2 / SHA 6323deb1）在 restore 阶段固定导出
    #   CARGO_INCREMENTAL=0，保存前又删除增量产物，故 CI 每次
    #   运行都从零增量状态开始，同一 job 内每个 crate 只编一次——没有复用机会，只多付
    #   写增量产物的成本。本机同内容同 target dir 对照：inc=0 CPU 152.5s、inc=1
    #   CPU 173.5s（+14%），增量产物 1.7 GB（≈ 现有依赖缓存的 1.5 倍，要跨运行复用
    #   就得连它一起缓存）。本地热回路由 kache 承担（.kache.toml preserve_incremental，
    #   workspace 全量重编命中缓存 4.6s），不需要 CI 侧开启。
    # - 刻意不用 OPT_LEVEL=1：实测（run 33975823593）负优化——workspace 大 crate
    #   的优化 pass 使编译 76s→2m43s，执行只省 ~14s，净 +60s，已回退。
    # 注意：RUSTFLAGS/debug 变更会使 cargo fingerprint 失效，变更后首跑全量冷编译
    # 一次（一次性成本），之后 rust-cache 恢复稳态。
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 换镜像起前缀隔离（issue #1109）：旧缓存是在宿主 runner 上编译的，与
          # 镜像内工具链/链接器产物彻底分层，避免宿主产物混进容器执行；切换后
          # 首跑一次冷编译（一次性成本）。
          prefix-key: ci-image
          # 只允许 main 维护缓存（CI 实测 2026-09，run 34745147580 等）：PR 改
          # workspace 的 Cargo.toml（域拆 crate 系列）即 key 精确 miss，Post 阶段
          # 冗余重存 ~1.1 GB（压包 + 上传）2m17–2m43；PR 恢复不受影响——经
          # restore-key 回退拿到 base 分支的缓存，merge 后新 key 自然固化进缓存。
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # 范围显式 `--workspace`（spec #1086 / issue #1087）：非虚拟 workspace 下 cargo
      # 默认只作用于根包，缺范围参数会静默漏跑成员 crate；cargo 对没有对应 target
      # 的成员自动跳过，故 `--lib --test '*'` 的组合对成员 crate 安全。
      # 显式 target 选择：lib + 全部集成 target（tests/ 下每个 *.rs 与 */main.rs 各一个
      # crate，当前 api_server / e2e / commands / sync_trigger_poll）。`--test` 的名称
      # 支持 Unix glob（cargo 文档明确要求单引号防 shell 展开），`'*'` 命中全部集成
      # target 而不含 bin——新增集成 target 自动进 CI，无「手工清单漏项静默漏跑」的
      # 坑（issue #988）。刻意不用 `--tests`：它会连带 bin 测试，把 ledger-perf 的
      # 生成器正确性单测（属性能工具链，perf-bench.yml 域，随每日常规基准一起运行）
      # 拖回 PR CI。副作用：显式 target 选择不跑 doc-tests（当前为 0 个，无损失）。
      - name: Rust 单元测试 + BDD/e2e 测试（cucumber）
        run: cargo test --workspace --lib --test '*'

  # 后端静态检查：与 backend job 同挂预构建镜像（issue #1109），fmt/clippy 组件
  # 已烘进镜像，job 内零安装步骤（改前 apt 阶段缓存命中也有 22s）。
  # 刻意不设 CARGO_PROFILE_DEV_DEBUG（issue #1110）：clippy 走 check 形态——只产出
  # metadata、不 codegen，debuginfo 水平既不改其耗时也几乎不改其缓存体积，设了只会
  # 白换一次缓存 key（本 job 不在 PR 关键路径上，收益为零）。
  backend-lint:
    name: 后端静态检查（fmt + clippy）
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    # 镜像 tag 刻意写死 upstream 路径，理由同 backend job。
    container:
      image: ghcr.io/asiazhang/ledger-ci-backend:latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 前缀隔离理由同 backend job（issue #1109）。
          prefix-key: ci-image
          # 只允许 main 维护缓存，理由同 backend job：key miss 时 Post 冗余重存
          # ~977 MB 走 2 分钟级（run 34745896185 实测）。
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 格式检查
        run: cargo fmt --all --check

      - name: Clippy 检查
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # 基础设施 rustdoc 门禁（issue #1139）：intra-doc link 漂移等 rustdoc 告警
      # 不被 clippy/fmt 拦截，单独用 cargo doc -D warnings 清零。范围锁定
      # ledger-infra（首装归零的 crate，--no-deps 只 rustdoc 本 crate，增量成本低）；
      # 与本地 check.sh 同门槛（删步骤即红：check-sh-rustdoc-gate.test.ts）。
      - name: 基础设施 rustdoc 门禁
        run: RUSTDOCFLAGS='-D warnings' cargo doc -p ledger-infra --no-deps

  # 发布构建：桌面三平台 + Android 四行矩阵并行（ADR-0066 / ADR-0074），产物
  # upload-artifact 交给 publish 汇总，单一 GitHub Release 拓扑不变。
  # workflow_dispatch 可在正式 tag 前手动试跑（publish 仅在 tag 触发，不会误建 Release）。
  # Android 行（ADR-0074 决策 2/4）：Ubuntu runner 上 tauri android build 显式指定
  # aarch64-linux-android 单 target——真机几乎全为 arm64-v8a，不沿用 Tauri 默认四 ABI
  # 合一（armv7 仅旧 32 位设备、x86 系仅模拟器，均无真实消费方）；versionCode 由 CI
  # 从 tag 按公式 major×10⁶ + minor×10³ + patch 派生并经 --config 注入（唯一口径，零手工）。
  # 签名接线（决策 3，issue #560）：配置 ANDROID_KEY_* secrets 后，构建经
  # keystore.properties 注入 release 签名并 apksigner 校验；未配置时干跑保持未签名，
  # tag 构建缺 secrets 直接失败（「先备份、再配 secrets、才启用发版」的机械执行），
  # 流程与验收见 docs/verification/560-android-apk-signing.md。
  # macOS 签名 + 公证（issue #658）：配置了 APPLE_* secrets 时自动导入证书签名，构建后
  # notarytool 公证（--wait）+ stapler 附着，并做 codesign/spctl/stapler validate 校验；
  # 未配置 secrets 时相关步骤自动跳过，产物保持未签名（干跑与 PR 构建不受影响）。
  release:
    name: 发布构建（${{ matrix.label }}）
    if: "startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'"
    # 签名相关路径提升到 job 级（导入/清理/公证/校验共用，消除重复）；钥匙串路径
    # 依赖 runner.temp——runner 上下文在 job 级 env 不可用（workflow_dispatch 会整份
    # 解析失败，HTTP 422 实测），只能在步骤脚本里取 $RUNNER_TEMP。secrets 刻意
    # 不升 job 级——避免注入无关步骤（如 Linux/Windows 构建）的进程环境。
    env:
      MACOS_BUNDLE_DIR: src-tauri/target/release/bundle/macos
      DMG_BUNDLE_DIR: src-tauri/target/release/bundle/dmg
      APK_BUNDLE_DIR: src-tauri/target/release/bundle/apk
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            label: macOS (arm64)
            os: macos-latest
            bundles: dmg
            artifact: openledger-macos-arm64
            paths: src-tauri/target/release/bundle/dmg/*.dmg
          - platform: linux
            label: Linux (x64)
            os: ubuntu-latest
            bundles: deb,appimage
            artifact: openledger-linux-x64
            # upload-artifact 的 glob 不支持 {a,b} 花括号展开（v0.5.0 构建实测漏配），改为显式多行路径。
            paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - platform: windows
            label: Windows (x64)
            os: windows-latest
            bundles: nsis
            artifact: openledger-windows-x64
            paths: src-tauri/target/release/bundle/nsis/*.exe
          # Android：bundles 不适用，构建走 tauri android build 专用步骤；产物经
          # 归集步骤统一命名为 OpenLedger_<版本>_arm64.apk 后交给 upload-artifact。
          - platform: android
            label: Android (arm64)
            os: ubuntu-latest
            artifact: openledger-android-arm64
            paths: src-tauri/target/release/bundle/apk/*.apk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Android 行同为 Linux runner，但不编译桌面目标，跳过 webkit/gtk 系统依赖。
      # 此清单与 .github/docker/backend-ci.Dockerfile 的 apt 清单同源语义（#1109）：
      # release job 是三平台原生构建，无法挂 Linux 容器镜像，保留独立安装；
      # 改 tauri 系统依赖时两处同步，不要只改一处。
      - name: 安装 Linux 系统依赖（tauri 编译与 AppImage 打包所需）
        if: runner.os == 'Linux' && matrix.platform != 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 安装 create-dmg（macOS DMG 打包所需）
        if: runner.os == 'macOS'
        run: brew untap aws/tap 2>/dev/null; brew install create-dmg

      # Android 构建链（ADR-0074）：JDK 17 + SDK（commandline-tools + 组件）+ 固定
      # 版本 NDK。runner 镜像不预置 sdkmanager（run 34317731980 实测 command not
      # found），统一走 setup-android；NDK 版本显式固定，NDK_HOME 指向固定路径供
      # tauri CLI 与 gradle rust 插件交叉编译共用。不做 SDK 缓存（首次冷跑下载
      # 约 2GB，接受）。
      - name: 安装 JDK 17（Android gradle 构建所需）
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK（commandline-tools + licenses）
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3

      - name: 安装 Android SDK 组件与 NDK
        if: matrix.platform == 'android'
        env:
          ANDROID_NDK_VERSION: 27.0.12077973
        run: |
          sdkmanager --install "platforms;android-36" "ndk;$ANDROID_NDK_VERSION"
          NDK_BIN="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          # llvm 统一工具链后 NDK 不再带 <triple>-ranlib 包装，openssl-sys vendored
          # 的 android Configure 目标仍按 {cross_prefix}ranlib 找工具（run
          # 34319561130 实测 not found → make install_dev 127），补 PATH 垫片。
          mkdir -p "$RUNNER_TEMP/android-shims"
          ln -sf "$NDK_BIN/llvm-ranlib" "$RUNNER_TEMP/android-shims/aarch64-linux-android-ranlib"
          echo "$RUNNER_TEMP/android-shims" >> "$GITHUB_PATH"

      - name: 安装 Rust Android 目标（arm64）
        if: matrix.platform == 'android'
        run: |
          rustup target add aarch64-linux-android

      # versionCode 唯一口径（ADR-0074 决策 4）：major×10⁶ + minor×10³ + patch。
      # tag 触发时从 tag 派生；workflow_dispatch 试跑无 tag，回退 tauri.conf.json 版本。
      # 非三段式版本显式失败，不静默算出错误值。
      - name: 派生版本与 versionCode
        if: matrix.platform == 'android'
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          fi
          MAJOR=${VERSION%%.*}
          REST=${VERSION#*.}
          MINOR=${REST%%.*}
          PATCH=${REST#*.}
          case "$REST" in *.*) ;; *) echo "✗ 版本号 $VERSION 不是三段式语义版本，无法派生 versionCode"; exit 1;; esac
          case "$MAJOR$MINOR$PATCH" in ''|*[!0-9]*) echo "✗ 版本号 $VERSION 不是三段式语义版本，无法派生 versionCode"; exit 1;; esac
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "versionCode=$VERSION_CODE versionName=$VERSION source=$GITHUB_REF_TYPE"
          {
            echo "APP_VERSION=$VERSION"
            echo "APP_VERSION_CODE=$VERSION_CODE"
          } >> "$GITHUB_ENV"

      # 证书导入（issue #658 步骤 3）：base64 p12 → 临时钥匙串。密码随机生成，
      # 仅本次 runner 生命周期内使用，不入 secrets。secrets 未配置时跳过（干跑）；
      # 跳过判断在脚本内而非 step if：secrets 不升 job 级 env（见 job env 注释）。
      - name: 导入 Apple 签名证书
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERT_P12" ]; then
            echo "⚠️ 未配置 APPLE_CERT_P12，跳过证书导入（产物将保持未签名）"
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/openledger-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/openledger-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo -n "$APPLE_CERT_P12" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # 关闭自动锁（新建钥匙串默认 5 分钟空闲上锁）：冷编译动辄几十分钟，
          # 到 codesign 碰私钥时钥匙串已锁，headless runner 上弹解锁框 = 永久挂起
          # （run 34202814573 实测卡死 10+ 分钟）。-t 21600 = 6 小时空闲才锁。
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: 构建桌面产物
        if: matrix.platform != 'android'
        run: pnpm run tauri build --bundles ${{ matrix.bundles }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # arm64 单 ABI 产物（ADR-0074 决策 2，显式 --target，不沿用 Tauri 默认四 ABI）。
      # 注入经 --config 补丁（CLI 写入 gen/android/app/tauri.properties，gradle 读取），
      # 不改 tauri.conf.json 与已入库的 gen/android 工程：versionCode 显式注入（公式
      # 唯一口径）；versionName 无对应配置键（CLI 2.11.4 schema 实测拒绝，run
      # 34318179293），改注入根 version——versionName 与 CLI 默认 versionCode 数学
      # （major×10⁶ + minor×10³ + patch，与显式注入同值）均从它派生。
      # 签名接线（issue #560 / ADR-0074 决策 3）：base64 keystore 解码到 runner 临时
      # 目录，口令与路径写入 keystore.properties（gradle release 签名配置读取，Tauri
      # 官方接线）。secrets 未配置时跳过（干跑保持未签名，与 macOS 证书行为一致）；
      # 跳过判断在脚本内而非 step if：secrets 不升 job 级 env（见 job env 注释）。
      - name: 解码 Android 签名 keystore
        if: matrix.platform == 'android'
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEY_BASE64" ]; then
            # tag 发布缺 secrets 直接失败：发版强约束是「先配 secrets 才启用」
            # （ADR-0074 决策 3），未签名 APK 不可安装也无法覆盖升级，禁止进 Release。
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "✗ tag 发布必须已签名：缺少 ANDROID_KEY_BASE64（先完成 keystore 备份并配齐 secrets，见 docs/verification/560-android-apk-signing.md）"
              exit 1
            fi
            echo "⚠️ 未配置 ANDROID_KEY_BASE64，跳过签名接线（产物将保持未签名）"
            exit 0
          fi
          : "${ANDROID_KEY_PASSWORD:?✗ 缺少 secret ANDROID_KEY_PASSWORD（签名必需）}"
          : "${ANDROID_KEY_ALIAS:?✗ 缺少 secret ANDROID_KEY_ALIAS（签名必需）}"
          KEYSTORE="$RUNNER_TEMP/openledger-release.jks"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$KEYSTORE"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$KEYSTORE"
          } > src-tauri/gen/android/keystore.properties
          echo "ANDROID_SIGNING=1" >> "$GITHUB_ENV"

      - name: 构建 Android arm64 APK
        if: matrix.platform == 'android'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONFIG="$RUNNER_TEMP/android-version-config.json"
          printf '{"version":"%s","bundle":{"android":{"versionCode":%s}}}\n' \
            "$APP_VERSION" "$APP_VERSION_CODE" > "$CONFIG"
          # --target 取值为短 ABI 名（aarch64/armv7/i686/x86_64，非 rust triple；
          # run 34319079302 实测），rustup 侧仍装 triple 全名。
          pnpm run tauri android build --apk --target aarch64 --config "$CONFIG"

      # 公证 + 附着（issue #658 步骤 5）：公证输入为 DMG 本体（submit --wait 阻塞至
      # Apple 出结果 → stapler 附着票据）。注：tauri 的 dmg 打包流程结束后会清掉
      # bundle/macos 下的 .app（run 34210128468 实测目录为空），无 .app 可单独公证，
      # zip 分发需另行方案（见 docs/verification/658-ci-signing-notarization.md）。
      - name: 公证 DMG（notarytool + stapler）
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERT_P12" ]; then
            echo "⚠️ 未配置签名证书，跳过公证"
            exit 0
          fi
          # 证书已配但公证凭据缺失：tag 发布场景下 fail fast，避免中途才报错
          : "${APPLE_ID:?✗ 缺少 secret APPLE_ID（公证必需）}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?✗ 缺少 secret APPLE_APP_SPECIFIC_PASSWORD（公证必需）}"
          : "${APPLE_TEAM_ID:?✗ 缺少 secret APPLE_TEAM_ID（公证必需）}"
          DMG_PATH=$(find "$DMG_BUNDLE_DIR" -maxdepth 1 -name '*.dmg' | head -n 1)
          echo "DMG_PATH=$DMG_PATH"
          [ -n "$DMG_PATH" ] || { echo "✗ 未找到待公证 .dmg"; exit 1; }
          PROFILE=openledger-notary
          xcrun notarytool store-credentials "$PROFILE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          xcrun notarytool submit "$DMG_PATH" --keychain-profile "$PROFILE" --wait
          xcrun stapler staple "$DMG_PATH"

      # 校验（issue #658 交付物）：DMG 公证票据附着有效、Gatekeeper 放行；临时
      # 挂载 DMG 验内部 .app——签名身份必须是 Developer ID Application 且启用
      # hardened runtime（公证必需，防止 bundler 默认行为变化）。任一失败即发布失败。
      - name: 校验签名与公证（Gatekeeper）
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
        run: |
          if [ -z "$APPLE_CERT_P12" ]; then
            echo "⚠️ 未配置签名证书，跳过校验"
            exit 0
          fi
          DMG_PATH=$(find "$DMG_BUNDLE_DIR" -maxdepth 1 -name '*.dmg' | head -n 1)
          xcrun stapler validate "$DMG_PATH"
          # spctl 需 GUI 会话上下文，headless CI 返回 Insufficient Context 误报
          # （run 34211413678），挪至 docs/verification/658 人工验收清单
          MNT="$RUNNER_TEMP/openledger-dmg-mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" "$DMG_PATH" >/dev/null
          APP_IN_DMG=$(find "$MNT" -maxdepth 2 -name '*.app' | head -n 1)
          codesign --verify --strict --verbose=2 "$APP_IN_DMG"
          # Authority= 证书链行需 --verbose>=2 才输出，缺省 -dv 会让下方 grep 恒假阴性
          # （run 34301373513 实测：签名与公证均通过，仅因缺 verbose 误报失败）
          codesign -dv --verbose=4 "$APP_IN_DMG" 2>&1 | grep -q 'Authority=Developer ID Application' \
            || { echo "✗ 签名身份不是 Developer ID Application"; exit 1; }
          codesign -dv --verbose=4 "$APP_IN_DMG" 2>&1 | grep -q 'runtime' \
            || { echo "✗ 未启用 hardened runtime（公证必需）"; exit 1; }
          hdiutil detach "$MNT"

      - name: 清理签名钥匙串
        if: always() && runner.os == 'macOS'
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/openledger-signing.keychain-db"
          [ -f "$KEYCHAIN_PATH" ] && security delete-keychain "$KEYCHAIN_PATH" || true
          # 恢复 login 钥匙串为默认，避免影响后续需要钥匙串的步骤
          security list-keychain -d user -s login.keychain-db || true

      # 归一命名（OpenLedger_<版本>_arm64.apk）后交 upload-artifact，与桌面
      # 产物一同汇入 publish 的单一 Release。未配置签名 secrets 的干跑产物未签名，
      # 真机安装需放行未知来源；正式 tag 缺 secrets 已在签名步骤直接失败
      # （升级安装的签名硬前提）。
      # 路径含 universal 系 gradle flavor 名：cargo-mobile2 不带 --split-per-abi 时
      # 恒走 assembleUniversal，target 经 -PabiList/-ParchList/-PtargetList 收窄，
      # 实际 APK 内容仅 arm64-v8a。
      - name: 归集 Android APK
        if: matrix.platform == 'android'
        run: |
          APK_OUT="src-tauri/gen/android/app/build/outputs/apk/universal/release"
          APK=$(find "$APK_OUT" -maxdepth 1 -name '*.apk' | head -n 1)
          [ -n "$APK" ] || { echo "✗ 未找到 APK 产物"; exit 1; }
          mkdir -p "$APK_BUNDLE_DIR"
          cp "$APK" "$APK_BUNDLE_DIR/OpenLedger_${APP_VERSION}_arm64.apk"

      # 签名校验（issue #560）：apksigner 确认最终上传的 APK 确已签名可安装。
      # 不用 jarsigner——minSdk 24 时 AGP 默认仅 v2+ scheme 签名，jarsigner 只认
      # v1 JAR 签名，会误报未签名。
      - name: 校验 APK 签名（apksigner）
        if: matrix.platform == 'android'
        run: |
          if [ -z "${ANDROID_SIGNING:-}" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "✗ tag 发布产物必须已签名，但签名未生效（ANDROID_SIGNING 未置位）"
              exit 1
            fi
            echo "⚠️ APK 未签名（未配置签名 secrets），跳过签名校验"
            exit 0
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          [ -n "$APKSIGNER" ] || { echo "✗ build-tools 中未找到 apksigner"; exit 1; }
          APK="$APK_BUNDLE_DIR/OpenLedger_${APP_VERSION}_arm64.apk"
          [ -f "$APK" ] || { echo "✗ 未找到归集后的 APK：$APK"; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK"

      - name: 收集发布产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  # 发布收尾：仅 tag 触发；下载全平台产物并创建唯一的 GitHub Release。
  publish:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 下载全平台产物
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: release

      - name: 提取 CHANGELOG 条目作为 Release 说明
        id: changelog
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          VER="${TAG_VERSION#v}"
          BODY="$(awk -v v="$VER" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && $0 ~ "^## \\[" {exit}
            found {print}
          ' CHANGELOG.md || true)"
          if [ -z "$BODY" ]; then
            BODY="（CHANGELOG 中未找到该版本条目）"
          fi
          printf '%s\n' "$BODY" > /tmp/release_body.md
          echo "body_file=/tmp/release_body.md" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.changelog.outputs.body_file }}
          files: release/**
