name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: 前端检查
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - run: npm test

  release:
    name: 构建 DMG 并发布
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: rustup update stable

      - run: brew untap aws/tap 2>/dev/null; brew install create-dmg

      - run: npm ci

      - run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 CHANGELOG 条目作为 Release 说明
        id: changelog
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          VER="${TAG_VERSION#v}"
          BODY="$(awk -v v="$VER" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && $0 ~ "^## \\[" {exit}
            found {print}
          ' CHANGELOG.md || true)"
          if [ -z "$BODY" ]; then
            BODY="（CHANGELOG 中未找到该版本条目）"
          fi
          printf '%s\n' "$BODY" > /tmp/release_body.md
          echo "body_file=/tmp/release_body.md" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.changelog.outputs.body_file }}
          files: src-tauri/target/release/bundle/dmg/*.dmg
