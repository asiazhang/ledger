name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend:
    name: 前端检查
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      - run: pnpm run build

      - run: pnpm test

      - name: 命令注册一致性检查
        run: node scripts/check-commands.js

      - name: 结构守门检查
        run: node scripts/check-structure.js

      - name: 文档一致性检查
        run: ./scripts/check-docs.sh

  backend:
    name: 后端检查（Rust 单测 + e2e）
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Linux 系统依赖（tauri 编译所需）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 格式检查
        run: cargo fmt --check

      - name: Clippy 检查
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust 单元测试 + BDD/e2e 测试（cucumber）
        run: cargo test --all

  # 发布构建：三平台矩阵并行（ADR-0066），产物 upload-artifact 交给 publish 汇总。
  # workflow_dispatch 可在正式 tag 前手动试跑（publish 仅在 tag 触发，不会误建 Release）。
  release:
    name: 发布构建（${{ matrix.label }}）
    if: "startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (arm64)
            os: macos-latest
            bundles: dmg
            artifact: openledger-macos-arm64
            paths: src-tauri/target/release/bundle/dmg/*.dmg
          - label: Linux (x64)
            os: ubuntu-latest
            bundles: deb,appimage
            artifact: openledger-linux-x64
            # upload-artifact 的 glob 不支持 {a,b} 花括号展开（v0.5.0 构建实测漏配），改为显式多行路径。
            paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - label: Windows (x64)
            os: windows-latest
            bundles: nsis
            artifact: openledger-windows-x64
            paths: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 系统依赖（tauri 编译与 AppImage 打包所需）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 安装 create-dmg（macOS DMG 打包所需）
        if: runner.os == 'macOS'
        run: brew untap aws/tap 2>/dev/null; brew install create-dmg

      - run: pnpm run tauri build --bundles ${{ matrix.bundles }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 收集发布产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  # 发布收尾：仅 tag 触发；下载全平台产物并创建唯一的 GitHub Release。
  publish:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 下载全平台产物
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: release

      - name: 提取 CHANGELOG 条目作为 Release 说明
        id: changelog
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          VER="${TAG_VERSION#v}"
          BODY="$(awk -v v="$VER" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && $0 ~ "^## \\[" {exit}
            found {print}
          ' CHANGELOG.md || true)"
          if [ -z "$BODY" ]; then
            BODY="（CHANGELOG 中未找到该版本条目）"
          fi
          printf '%s\n' "$BODY" > /tmp/release_body.md
          echo "body_file=/tmp/release_body.md" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.changelog.outputs.body_file }}
          files: release/**
