name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # CI 耗时基线（2026-09，run 33971568279）：frontend ≈229s（pnpm test 占 91%，
  # vitest import+jsdom 环境创建是每文件固定成本，并行度仅 ~1.4 核），backend ≈222s
  # （编译 76s + 固定 69s + clippy 19s + 测试执行 48s）。据此拆分为四个并行 job：
  # 关键路径 = max(后端测试 ~180s, 前端测试分片 ~116s)，目标总时长 ~3 分钟。

  # 前端构建与一致性检查：vue-tsc 类型检查（前端 + 守门脚本与测试两个工程）+ oxlint lint
  # （--deny-warnings，与本地 check.sh 同门槛）+ vite build + 守门脚本（Bun 运行时，ADR-0083），~25s。
  # 测试拆至 frontend-test 分片 job，二者并行。
  frontend:
    name: 前端检查
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      # 守门脚本运行时 = Bun（ADR-0083）；版本与本地门槛同一固定值，升级走显式 bump
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: pnpm run build

      - name: 守门脚本与测试类型检查
        run: pnpm exec vue-tsc -p tsconfig.scripts.json --noEmit

      - name: 前端 lint
        run: pnpm exec oxlint --deny-warnings

      - name: 命令注册一致性检查
        run: bun scripts/check-commands.ts

      - name: 结构守门检查
        run: bun scripts/check-structure.ts

      - name: 文档一致性检查
        run: ./scripts/check-docs.sh

  # 前端测试按 shard 均分到 2 个并行 runner：vitest 单 job 208s（累计 586s），
  # 分片后各 ~116s。不采用 isolate:false（worker 复用 jsdom 省每文件环境创建），
  # 因 pinia/i18n/fake timers 等模块级单例跨文件泄漏风险不可控，放弃该项收益。
  frontend-test:
    name: 前端测试（shard ${{ matrix.shard }}/2）
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      # 守门脚本测试经 spawnSync('bun', …) 同运行时调用（ADR-0083），需安装 bun
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Vitest 分片运行
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/2

  # 后端测试：fmt/clippy 拆至 backend-lint 并行（clippy 仅 ~19s，不值得占关键路径）。
  # cargo test 本体 ~125s（编译 76s + cucumber e2e 388 场景 29s 等），固定开销靠
  # apt 下载缓存压缩（27s → ~10s）；rust-cache 默认按 job 隔离缓存，两个 job 各自
  # 维护 check-profile / test-profile 产物，冷启动各编一次，热启动行为与拆分前一致。
  backend:
    name: 后端测试（Rust 单测 + BDD/e2e）
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    # CI 提速（仅 CI，本地开发不受影响）：
    # - DEBUG=1：workspace 自身降 debuginfo 到 line-tables-only（依赖已同配置），
    #   纯编译收益，backtrace 行号保留。
    # - RUSTFLAGS + mold：链接器换 mold（lib + 两个集成测试 crate 各全量链接一次，
    #   链接是 workspace 编译的大头），apt 装 mold 秒级完成。
    # - 刻意不用 OPT_LEVEL=1：实测（run 33975823593）负优化——workspace 大 crate
    #   的优化 pass 使编译 76s→2m43s，执行只省 ~14s，净 +60s，已回退。
    # 注意：RUSTFLAGS/debug 变更会使 cargo fingerprint 失效，变更后首跑全量冷编译
    # 一次（一次性成本），之后 rust-cache 恢复稳态。
    env:
      CARGO_PROFILE_DEV_DEBUG: "1"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v7

      # 目录属 root，不 chown 的话 actions/cache 恢复解包全部 Permission denied
      # （实测 run 33973388654），缓存命中也等于没恢复。
      - name: 预备 apt 缓存目录属主
        run: sudo chown -R "$(id -un):$(id -gn)" /var/cache/apt/archives

      - name: 恢复 apt 下载缓存
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: apt-tauri-deps-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}

      # partial/ 目录属 root 权限 700，不清掉会导致 post 保存缓存时 tar 打包失败
      # （实测 run 33972603641 报 "tar failed with exit code 2"，缓存从未存上）。
      - name: 安装 Linux 系统依赖（tauri 编译所需 + mold 链接器）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            mold
          sudo rm -rf /var/cache/apt/archives/partial /var/cache/apt/archives/lock

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 显式列出 target（lib + api_server + e2e）：不编译也不运行 bin 测试——
      # ledger-perf 的生成器正确性单测属性能工具链（perf-bench.yml 域），随每日常规
      # 基准一起运行；PR CI 只守护产品代码路径。副作用：显式 target 选择不跑
      # doc-tests（当前为 0 个，无损失）。
      - name: Rust 单元测试 + BDD/e2e 测试（cucumber）
        run: cargo test --lib --test api_server --test e2e

  backend-lint:
    name: 后端静态检查（fmt + clippy）
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: 预备 apt 缓存目录属主
        run: sudo chown -R "$(id -un):$(id -gn)" /var/cache/apt/archives

      - name: 恢复 apt 下载缓存
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: apt-tauri-deps-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: 安装 Linux 系统依赖（tauri 编译所需）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
          sudo rm -rf /var/cache/apt/archives/partial /var/cache/apt/archives/lock

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 格式检查
        run: cargo fmt --check

      - name: Clippy 检查
        run: cargo clippy --all-targets --all-features -- -D warnings

  # 发布构建：三平台矩阵并行（ADR-0066），产物 upload-artifact 交给 publish 汇总。
  # workflow_dispatch 可在正式 tag 前手动试跑（publish 仅在 tag 触发，不会误建 Release）。
  # macOS 签名 + 公证（issue #658）：配置了 APPLE_* secrets 时自动导入证书签名，构建后
  # notarytool 公证（--wait）+ stapler 附着，并做 codesign/spctl/stapler validate 校验；
  # 未配置 secrets 时相关步骤自动跳过，产物保持未签名（干跑与 PR 构建不受影响）。
  release:
    name: 发布构建（${{ matrix.label }}）
    if: "startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'"
    # 签名相关非敏感路径提升到 job 级（导入/清理/公证/校验共用，消除重复）；
    # secrets 刻意不升 job 级——避免注入无关步骤（如 Linux/Windows 构建）的进程环境。
    env:
      OPENLEDGER_KEYCHAIN: ${{ runner.temp }}/openledger-signing.keychain-db
      MACOS_BUNDLE_DIR: src-tauri/target/release/bundle/macos
      DMG_BUNDLE_DIR: src-tauri/target/release/bundle/dmg
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (arm64)
            os: macos-latest
            bundles: dmg
            artifact: openledger-macos-arm64
            # dmg 之外额外上传「已公证 .app 的分发 zip」（公证步骤生成），免挂载即可安装。
            paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.zip
          - label: Linux (x64)
            os: ubuntu-latest
            bundles: deb,appimage
            artifact: openledger-linux-x64
            # upload-artifact 的 glob 不支持 {a,b} 花括号展开（v0.5.0 构建实测漏配），改为显式多行路径。
            paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - label: Windows (x64)
            os: windows-latest
            bundles: nsis
            artifact: openledger-windows-x64
            paths: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 系统依赖（tauri 编译与 AppImage 打包所需）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 安装 create-dmg（macOS DMG 打包所需）
        if: runner.os == 'macOS'
        run: brew untap aws/tap 2>/dev/null; brew install create-dmg

      # 证书导入（issue #658 步骤 3）：base64 p12 → 临时钥匙串。密码随机生成，
      # 仅本次 runner 生命周期内使用，不入 secrets。secrets 未配置时跳过（干跑）；
      # 跳过判断在脚本内而非 step if：secrets 不升 job 级 env（见 job env 注释）。
      - name: 导入 Apple 签名证书
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERT_P12" ]; then
            echo "⚠️ 未配置 APPLE_CERT_P12，跳过证书导入（产物将保持未签名）"
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/openledger-cert.p12"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo -n "$APPLE_CERT_P12" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$OPENLEDGER_KEYCHAIN"
          security default-keychain -s "$OPENLEDGER_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$OPENLEDGER_KEYCHAIN"
          security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$OPENLEDGER_KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$OPENLEDGER_KEYCHAIN"
          security list-keychain -d user -s "$OPENLEDGER_KEYCHAIN"

      - run: pnpm run tauri build --bundles ${{ matrix.bundles }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 公证 + 附着（issue #658 步骤 5）：.app 以 zip 提交公证（票据 stapler 附着回 .app，
      # 分发 zip 内即已公证），DMG 单独提交公证并附着。--wait 阻塞至 Apple 出结果。
      - name: 公证 DMG 与 zip（notarytool + stapler）
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERT_P12" ]; then
            echo "⚠️ 未配置签名证书，跳过公证"
            exit 0
          fi
          # 证书已配但公证凭据缺失：tag 发布场景下 fail fast，避免中途才报错
          : "${APPLE_ID:?✗ 缺少 secret APPLE_ID（公证必需）}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?✗ 缺少 secret APPLE_APP_SPECIFIC_PASSWORD（公证必需）}"
          : "${APPLE_TEAM_ID:?✗ 缺少 secret APPLE_TEAM_ID（公证必需）}"
          APP_PATH=$(find "$MACOS_BUNDLE_DIR" -maxdepth 1 -name '*.app' | head -n 1)
          DMG_PATH=$(find "$DMG_BUNDLE_DIR" -maxdepth 1 -name '*.dmg' | head -n 1)
          PROFILE=openledger-notary
          xcrun notarytool store-credentials "$PROFILE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/openledger-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/openledger-notarize.zip" --keychain-profile "$PROFILE" --wait
          xcrun stapler staple "$APP_PATH"
          DMG_STEM=$(basename "$DMG_PATH" .dmg)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" \
            "$MACOS_BUNDLE_DIR/${DMG_STEM}.zip"
          xcrun notarytool submit "$DMG_PATH" --keychain-profile "$PROFILE" --wait
          xcrun stapler staple "$DMG_PATH"

      # 校验（issue #658 交付物）：签名身份必须是 Developer ID Application 且
      # 启用 hardened runtime（公证必需，防止 bundler 默认行为变化），公证票据
      # 附着有效、Gatekeeper 评估放行——任一失败即发布失败。
      - name: 校验签名与公证（Gatekeeper）
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
        run: |
          if [ -z "$APPLE_CERT_P12" ]; then
            echo "⚠️ 未配置签名证书，跳过校验"
            exit 0
          fi
          APP_PATH=$(find "$MACOS_BUNDLE_DIR" -maxdepth 1 -name '*.app' | head -n 1)
          DMG_PATH=$(find "$DMG_BUNDLE_DIR" -maxdepth 1 -name '*.dmg' | head -n 1)
          codesign --verify --strict --verbose=2 "$APP_PATH"
          codesign -dv "$APP_PATH" 2>&1 | grep -q 'Authority=Developer ID Application' \
            || { echo "✗ 签名身份不是 Developer ID Application"; exit 1; }
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -q 'runtime' \
            || { echo "✗ 未启用 hardened runtime（公证必需）"; exit 1; }
          spctl --assess --type execute -vv "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open -vv "$DMG_PATH"

      - name: 清理签名钥匙串
        if: always() && runner.os == 'macOS'
        run: |
          [ -f "$OPENLEDGER_KEYCHAIN" ] && security delete-keychain "$OPENLEDGER_KEYCHAIN" || true
          # 恢复 login 钥匙串为默认，避免影响后续需要钥匙串的步骤
          security list-keychain -d user -s login.keychain-db || true

      - name: 收集发布产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  # 发布收尾：仅 tag 触发；下载全平台产物并创建唯一的 GitHub Release。
  publish:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 下载全平台产物
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: release

      - name: 提取 CHANGELOG 条目作为 Release 说明
        id: changelog
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          VER="${TAG_VERSION#v}"
          BODY="$(awk -v v="$VER" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && $0 ~ "^## \\[" {exit}
            found {print}
          ' CHANGELOG.md || true)"
          if [ -z "$BODY" ]; then
            BODY="（CHANGELOG 中未找到该版本条目）"
          fi
          printf '%s\n' "$BODY" > /tmp/release_body.md
          echo "body_file=/tmp/release_body.md" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.changelog.outputs.body_file }}
          files: release/**
