    note: "<b>读侧 · 四种出资情形</b>(虚线分节条与「特性后/现状临时」切换是讨论装置,不属于设计)— 真实界面不存在「多对一/多对多」标签;信号只有三个:<b>行级</b>「等 N 账户」标记(分解行才有)、<b>行尾订单徽标</b>(同单各行各自携带,排序/筛选/翻页都跟着行走)、<b>详情订单区</b>(点任意一行即见:N 行商品、合计、出资构成)。订单汇总不占分页位、不怕跨页——这正是它比「组头 + 后续 N 行」可靠的原因。" },
  { key: "D", name: "录入速写(范围外)",
    note: "<b>D · 录入/编辑表单速写</b> — <b>本单范围外</b>(Q6 已裁录入侧不做,走契约)。此屏仅供讨论:Q2 契约互斥在表单上如何表达、Q7 约束(Σ==交易金额 / tag 上限 / 同账户多条)、Q8c 单⇄多就地互转。金额输入可直接改动体验 Σ 校验。" },
];

/* ── 状态 ── */
const state = {
  variant: readVariant(),
  selected: "t1",
  drawerOpen: true,
  expanded: new Set(),
  eMode: ((location.search + location.hash).match(/emode=(\w+)/) || [])[1] || "future",
  draft: {
    mode: "multi", singleAcc: "xjk",
    rows: [ { a: "xjk", amt: 2853, tag: "罐装" }, { a: "ye", amt: 25307, tag: "固体饼干" } ],
    target: 28160,
  },
};

function readVariant() {
  const m = location.search.match(/[?&]variant=([RD])/) || location.hash.match(/variant=([RD])/);
  return m ? m[1] : "R";
}
function writeVariant(v) {
  try { history.replaceState(null, "", "?variant=" + v); } catch (e) { location.hash = "variant=" + v; }
}

/* ── 工具 ── */
function fmt(c) { return "¥" + (c / 100).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function lk(name) { return '<a href="javascript:void 0" class="lk">' + name + "</a>"; }
function distinct(fund) { return [...new Set(fund.map(f => f.a))]; }
function byId(id) { return TXNS.find(t => t.id === id) || LEGACY_ROWS[id]; }
function el(id) { return document.getElementById(id); }
function tagChip(t) { return t ? '<span class="ftag">' + t + "</span>" : '<span class="ftag" style="visibility:hidden">–</span>'; }

/* ── 列表:账户单元格(按变体) ── */
function accountCell(tx) {
  if (tx.kind === "transfer") return lk(ACC[tx.from].n) + ' <span class="arr">→</span> ' + lk(ACC[tx.to].n);
  if (!tx.fund) return lk(ACC[tx.acc].n);
  const dist = distinct(tx.fund);
  let base = lk(ACC[tx.fund[0].a].n);
  if (dist.length === 1) base += ' <span class="suf">· 同账户 ' + tx.fund.length + " 笔</span>";
  else base += ' <span class="suf">等 ' + dist.length + " 账户</span>";
  return base;
}
function fundChipForList(tx) { return tx.derived ? ' <span class="auto-chip">按比例自动分解</span>' : ""; }


/* ── E 变体:订单分组(组合支付) ── */
function eDisplayList() {
  const out = [];
  const band = (cs, desc) => out.push({ band: true, cs, desc });
  band("一对一", "一笔交易 · 一个账户 —— 现状形态,列表无任何新标记");
  out.push(byId("t7"), byId("t5"));
  band("一对多", "一笔交易 · 多个账户 —— 行级标记「等 N 账户」,详情看出资分解");
  out.push(byId("t4"), byId("t3"), byId("t1"), byId("t2"));
  band("多对一", "多行商品 · 一个账户 —— 行尾订单徽标 → 详情内看订单汇总(出资徽标 1 枚)");
  out.push(byId("t8"), byId("t9"));
  band("多对多", "多行商品 · 多个账户 —— 仅跨界行带行级标记;订单汇总里出资徽标 ≥ 2 枚");
  out.push(byId("t10"));
  if (state.eMode === "legacy") out.push(LEGACY_ROWS.t11a, LEGACY_ROWS.t11b);
  else out.push(byId("t11"));
  out.push(byId("t12"));
  out.push({ noteRow: "transfer(转账)/ 投资类不在本特性范围 —— Q1 已裁:转账两端已表达、投资走出资账户(ADR-0096);定时计划生成亦维持单出资" });
  return out;
}
function orderRows(orderId) {
  const rows = [];
  for (const t of TXNS) {
    if (t.order !== orderId) continue;
    if (t.crossing && state.eMode === "legacy") rows.push(LEGACY_ROWS[t.id + "a"], LEGACY_ROWS[t.id + "b"]);
    else rows.push(t);
  }
  return rows;
}
function caseBandRow(b) {
  return '<tr class="case-band"><td colspan="9"><b>' + b.cs + "</b>" + (b.desc ? " — " + b.desc : "") + "</td></tr>";
}
function noteRowRow(n) {
  return '<tr class="note-row"><td colspan="9">' + n.noteRow + "</td></tr>";
}
function orderChip(orderId) {
  return ' <span class="order-chip">订单 ' + orderId + "</span>";
}
function orderSection(tx) {
  const rows = orderRows(tx.order);
  const total = rows.reduce((s, t) => s + t.amount, 0);
  const byAcc = {};
  for (const t of rows) for (const f of (t.fund || [{ a: t.acc, m: t.amount }])) byAcc[f.a] = (byAcc[f.a] || 0) + f.m;
  const chips = Object.entries(byAcc).map(([a, m]) =>
    '<span class="chip"><i style="background:' + ACC[a].c + '"></i>' + ACC[a].n + " " + fmt(m) + "</span>").join("");
  const crossing = rows.some(t => t.crossing || t.legacy);
  const toggle = crossing
    ? '<div style="margin-top:8px">' +
      '<button class="exp' + (state.eMode === "future" ? " on" : "") + '" data-action="emode" data-m="future">特性后 · 跨界行 1 行 2 出资</button> ' +
      '<button class="exp' + (state.eMode === "legacy" ? " on" : "") + '" data-action="emode" data-m="legacy">现状临时 · 拆 2 行</button>' +
      ' <span class="suf">← 切换为讨论装置,不属于设计</span></div>'
    : "";
  return '<div class="dsec"><h3>所属订单 ' + tx.order + " · " + rows.length + " 行商品 · 合计 " + fmt(total) + "</h3>" +
    '出资构成 <span class="chips">' + chips + "</span>" + toggle +
    '<div style="margin-top:6px">' + rows.map(t =>
      '<div class="flowline"><span>' + (t.note || t.cat).replace(/^订单 \S+ · /, "") + "</span>" +
      '<span class="s suf">' + fmt(t.amount) + "</span></div>").join("") + "</div></div>";
}

function renderTable() {
  const list = eDisplayList();
  let rows = "";
  for (const tx of list) {
    if (tx.band) { rows += caseBandRow(tx); continue; }
    if (tx.noteRow) { rows += noteRowRow(tx); continue; }
    const k = KIND[tx.kind];
    const sel = tx.id === state.selected ? " sel" : "";
    rows += '<tr class="row' + sel + '" data-action="select" data-id="' + tx.id + '">' +
      '<td>' + tx.date + "</td>" +
      '<td><span class="tag ' + k.cls + '">' + k.label + "</span>" +
        (tx.legacy ? ' <span class="tmp-chip">跨界拆分</span>' : fundChipForList(tx)) + "</td>" +
      '<td class="ellipsis">' + (tx.cat || "-") + "</td>" +
      '<td class="ellipsis">' + (tx.mer ? lk(tx.mer) : "-") + "</td>" +
      "<td>" + accountCell(tx) + "</td>" +
      '<td class="suf">' + (tx.src || "-") + "</td>" +
      '<td class="ellipsis">' + (tx.order ? orderChip(tx.order) : "") + (tx.note ? tx.note : "-") + "</td>" +
      '<td class="r"><span class="amt ' + k.cc + '">' + fmt(tx.amount) + "</span></td>" +
      '<td class="suf">⋯</td></tr>';
  }
  return '<div class="card"><table class="tbl"><colgroup>' +
    '<col style="width:92px"><col style="width:150px"><col style="width:132px"><col style="width:84px">' +
    '<col style="width:200px"><col style="width:70px"><col><col style="width:104px"><col style="width:44px">' +
    '</colgroup><thead><tr><th>日期</th><th>类型</th><th>分类</th><th>商户</th><th>账户</th><th>来源</th><th>备注</th><th class="r">金额</th><th></th></tr></thead>' +
    "<tbody>" + rows + "</tbody></table></div>";
}

/* ── 详情抽屉(按变体) ── */
function fundSection(tx) {
  const total = tx.amount;
  const cap = tx.derived
    ? '<div class="derived-note">退款缺省按出资比例自动分解 · 分解为读时推导(未单独落库),可显式指定出资覆盖</div>'
    : "";
  return cap + tx.fund.map(f =>
    '<div class="frow"><span class="facc">' + lk(ACC[f.a].n) + "</span>" + tagChip(f.t) +
    '<span class="famt">' + fmt(f.m) + "</span></div>").join("") +
    '<div class="sumline"><span>' + tx.fund.length + " 项 · Σ 出资</span><span class=\"amt\">" + fmt(total) + "</span></div>";
}


function flowLines(tx) {
  const flows = [];
  const sign = tx.kind === "expense" ? -1 : 1;
  if (tx.fund) for (const f of tx.fund) flows.push({ n: ACC[f.a].n, v: sign * f.m });
  else if (tx.kind === "transfer") { flows.push({ n: ACC[tx.from].n, v: -tx.amount }, { n: ACC[tx.to].n, v: tx.amount }); }
  else flows.push({ n: ACC[tx.acc].n, v: sign * tx.amount });
  return flows.map(f => '<div class="flowline"><span>' + f.n + "</span>" +
    '<span class="s" style="color:' + (f.v >= 0 ? "#18a058" : "#d03050") + '">' + (f.v >= 0 ? "+" : "") + fmt(f.v) + "</span></div>").join("");
}

function renderDrawer() {
  const v = state.variant;
  if (v === "D" || !state.drawerOpen) { el("overlay").style.display = "none"; el("drawer").style.display = "none"; return; }
  const tx = byId(state.selected); if (!tx) { el("overlay").style.display = "none"; el("drawer").style.display = "none"; return; }
  const k = KIND[tx.kind];
  el("overlay").style.display = "block"; el("drawer").style.display = "flex";
  el("drawer").innerHTML =
    '<div class="dhead"><div class="meta">' +
      '<span class="tag ' + k.cls + '">' + k.label + "</span><h2>" + (tx.mer || tx.cat || "交易详情") + "</h2>" +
      '<button class="close" data-action="close">✕</button></div>' +
      '<div class="big-amt ' + k.cc + '">' + fmt(tx.amount) + "</div></div>" +
    '<div class="dbody">' +
      '<div class="dsec"><h3>基本信息</h3><dl class="kv">' +
        "<dt>日期</dt><dd>" + tx.date + "</dd>" +
        "<dt>分类</dt><dd>" + (tx.cat || "-") + "</dd>" +
        "<dt>商户</dt><dd>" + (tx.mer ? lk(tx.mer) : "-") + "</dd>" +
        "<dt>备注</dt><dd>" + (tx.note || "-") + "</dd>" +
        "<dt>来源</dt><dd>" + (tx.src || "-") + "</dd></dl></div>" +
      (tx.order ? orderSection(tx) : "") +
      (tx.fund
        ? '<div class="dsec"><h3>出资分解(Funding · ' + tx.fund.length + " 项)</h3>" + fundSection(tx) + "</div>"
        : '<div class="dsec"><h3>出资分解</h3><div class="suf">单出资交易(现状形态),无分解子行</div></div>') +
      '<div class="dsec"><h3>账户流水(InvolvingAccount 口径)</h3>' + flowLines(tx) + "</div>" +
    "</div>";
}

/* ── 变体 D:表单 ── */
function renderD() {
  const d = state.draft;
  const accOpts = sel => Object.entries(ACC).map(([k, a]) =>
    '<option value="' + k + '"' + (k === sel ? " selected" : "") + ">" + a.n + "</option>").join("");
  const sum = d.rows.reduce((s, r) => s + r.amt, 0);
  const sigmaHtml = sigmaEl(sum, true);
  let body;
  if (d.mode === "single") {
    body = '<div class="fld"><label>账户</label><select data-f="single">' + accOpts(d.singleAcc) + "</select></div>" +
      '<div class="hint">现状形态:单 <b>account_id</b> 必填。</div>';
  } else {
    body = d.rows.map((r, i) =>
      '<div class="frow-edit">' +
        '<select data-f="acc" data-i="' + i + '">' + accOpts(r.a) + "</select>" +
        '<input type="number" step="0.01" min="0.01" data-f="amt" data-i="' + i + '" value="' + (r.amt / 100).toFixed(2) + '">' +
        '<input type="text" maxlength="50" placeholder="扣款标签(选填,≤50字)" data-f="tag" data-i="' + i + '" value="' + (r.tag || "") + '">' +
        '<button class="del" data-action="delrow" data-i="' + i + '" title="删除出资项">✕</button>' +
      "</div>").join("") +
      '<button class="addrow" data-action="addrow">+ 添加出资项</button>' + sigmaHtml;
  }
  return '<div class="form-wrap">' +
    '<div class="hint" style="margin-bottom:10px">以 t1(京东组合支付 ¥281.60)为例的<b>编辑表单</b>。切换「出资方式」观察 Q2 互斥的表单表达;改动金额体验 Q7c 的 Σ 校验。</div>' +
    '<div class="form-card"><h2>编辑交易 · 支出</h2>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">' +
        '<div class="fld"><label>日期</label><input type="date" value="2026-09-28"></div>' +
        '<div class="fld"><label>金额</label><input type="text" value="281.60"></div>' +
      "</div>" +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">' +
        '<div class="fld"><label>分类</label><input type="text" value="食品饮料 · 零食"></div>' +
        '<div class="fld"><label>商户</label><input type="text" value="京东"></div>' +
      "</div>" +
      '<div class="fld"><label>出资方式</label>' +
        '<span class="seg">' +
          '<button class="' + (d.mode === "single" ? "on" : "") + '" data-action="mode" data-m="single">单账户</button>' +
          '<button class="' + (d.mode === "multi" ? "on" : "") + '" data-action="mode" data-m="multi">多账户分解</button>' +
        "</span></div>" +
      body +
      '<div class="mutex"><b>契约(Q2,互斥):</b>带非空 funding[] ⇒ 禁止 account_id(码化报错);不带 ⇒ account_id 必填。表单层面表现为两种形态切换,而非两个并存字段。<br><b>Q8c:</b>单 ⇄ 多就地互转走既有修改协议,受影响账户取并集重算——即本表单两种形态的直接切换。</div>' +
    "</div></div>";
}
function sigmaEl(sum, asHtml) {
  const d = state.draft;
  const ok = sum === d.target;
  const text = ok
    ? "✓ Σ 出资 " + fmt(sum) + " = 交易金额 " + fmt(d.target)
    : "✗ Σ 出资 " + fmt(sum) + " ≠ 交易金额 " + fmt(d.target) + "(差 " + fmt(d.target - sum) + ")";
  if (!asHtml) { const el = document.getElementById("sigma"); if (!el) return; el.className = "sigma " + (ok ? "ok" : "bad"); el.textContent = text; return; }
  return '<div class="sigma ' + (ok ? "ok" : "bad") + '" id="sigma">' + text + "</div>";
}
function refreshSigma() {
  const d = state.draft;
  sigmaEl(d.rows.reduce((s, r) => s + r.amt, 0), false);
}

/* ── 渲染入口 ── */
function render() {
  const v = VARIANTS.find(x => x.key === state.variant);
  el("note").innerHTML = '<div class="note">' + v.note + ' <span class="suf">(点击行查看详情 · ←/→ 切换变体)</span></div>';
  el("screen").innerHTML = state.variant === "D" ? renderD() : renderTable();
  renderDrawer();
  el("switcher").innerHTML =
    '<button class="arr-btn" data-action="vprev">‹</button>' +
    '<span class="vlabel"><b>' + v.key + "</b> · " + v.name + "</span>" +
    '<button class="arr-btn" data-action="vnext">›</button>' +
    '<span class="dots">' + VARIANTS.map(x =>
      '<button class="dot-b' + (x.key === state.variant ? " on" : "") + '" data-action="vset" data-v="' + x.key + '">' + x.key + "</button>").join("") +
    "</span>";
}

/* ── 事件 ── */
function setVariant(v) { state.variant = v; state.expanded.clear(); writeVariant(v); render(); }
function cycle(dir) {
  const i = VARIANTS.findIndex(x => x.key === state.variant);
  setVariant(VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].key);
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-action]");
  if (!t) { if (e.target === el("overlay")) { state.drawerOpen = false; renderDrawer(); } return; }
  const act = t.dataset.action;
  if (act === "select") { state.selected = t.dataset.id; state.drawerOpen = true; render(); }
  else if (act === "expand") { e.stopPropagation(); const id = t.dataset.id; state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id); render(); }
  else if (act === "close") { state.drawerOpen = false; renderDrawer(); }
  else if (act === "vprev") cycle(-1);
  else if (act === "vnext") cycle(1);
  else if (act === "vset") setVariant(t.dataset.v);
  else if (act === "mode") { state.draft.mode = t.dataset.m; render(); }
  else if (act === "emode") { state.eMode = t.dataset.m; render(); }
  else if (act === "addrow") { state.draft.rows.push({ a: "xjk", amt: 0, tag: "" }); render(); }
  else if (act === "delrow") { state.draft.rows.splice(+t.dataset.i, 1); render(); }
});
document.addEventListener("input", e => {
  const f = e.target.dataset.f; if (!f) return;
  const d = state.draft, i = +e.target.dataset.i;
  if (f === "amt") { d.rows[i].amt = Math.max(0, Math.round(parseFloat(e.target.value || "0") * 100) || 0); refreshSigma(); }
  else if (f === "tag") d.rows[i].tag = e.target.value;
  else if (f === "acc") d.rows[i].a = e.target.value;
  else if (f === "single") d.singleAcc = e.target.value;
});
document.addEventListener("keydown", e => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === "ArrowLeft") cycle(-1);
  else if (e.key === "ArrowRight") cycle(1);
  else if (e.key === "Escape") { state.drawerOpen = false; renderDrawer(); }
});

render();
</script>
</body>
</html>
